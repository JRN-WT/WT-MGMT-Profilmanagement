<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WERK TRIFFT – Profilmanagement</title><style>
:root{--n:#143d6a;--o:#d76f23;--c:#f9f6ef;--p:#fff;--m:#f0ebe0;--l:#c8bea8;--t:#2b2b2b;--s:#66758a;--g:#3d6e56}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font:14px Arial,sans-serif}.top{height:60px;background:var(--n);color:#fff;border-bottom:3px solid var(--o);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font-weight:800;letter-spacing:.07em}.sub{font-size:12px;color:#cfdae9}.wrap{max-width:1320px;margin:auto;padding:34px 28px 70px}h1{font-size:30px;margin:0}h2{font-size:18px;margin:0}h3{font:11px monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--s);margin:0}.intro,.muted{color:var(--s);line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:15px}.card{margin-top:26px;background:var(--p);border:1px solid var(--l);border-radius:8px;overflow:hidden}.head,.body{padding:18px}.head{border-bottom:1px solid var(--l)}.button{border:0;border-radius:5px;padding:10px 14px;background:var(--o);color:#fff;font-weight:bold;cursor:pointer}.button.secondary,.add{background:var(--m);color:var(--n);border:1px solid var(--l)}.profile{width:100%;border:0;border-bottom:1px solid var(--l);background:#fffefa;text-align:left;padding:16px 18px;display:grid;grid-template-columns:42px 1fr 130px 24px;gap:13px;align-items:center;cursor:pointer}.profile:hover{background:#f7f2e8}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e6ecf5;color:var(--n);font-weight:bold}.name{font-weight:bold}.status{font:11px monospace;padding:4px 7px;width:max-content;background:#fef0e0;color:#9a6800}.Aktuell,.Freigegeben{background:#e0ece5;color:var(--g)}.Basisprofil-aktualisiert{background:#e8f0f8;color:var(--n)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--l);margin-top:22px}.tab{border:0;background:transparent;padding:13px 2px;border-bottom:3px solid transparent;font-weight:bold;color:var(--s);cursor:pointer}.tab.active{border-color:var(--o);color:var(--n)}.view{display:none;padding-top:22px}.view.active{display:block}.profilehead{background:#fff;border:1px solid var(--l);border-radius:8px;padding:22px;display:flex;gap:16px;align-items:center}.profilehead .avatar{width:60px;height:60px;font-size:18px}.actions{margin-left:auto;display:flex;gap:8px}.section{background:#fff;border:1px solid var(--l);border-radius:8px;margin-bottom:16px;overflow:hidden}.section>h3{padding:14px 17px;border-bottom:1px solid var(--l)}.section>div{padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}.field label{font:10px monospace;text-transform:uppercase;color:var(--s)}input,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:4px;background:#fffefa;font:inherit}textarea{min-height:80px}.item{display:flex;gap:8px;margin:7px 0}.item input{flex:1}.remove{border:0;background:#f8e7e3;color:#832233;padding:5px 9px;cursor:pointer}.add{margin-top:8px;padding:8px 10px;border-radius:4px;font-weight:bold;cursor:pointer}.project{border:1px solid var(--l);padding:13px;margin:10px 0;background:#fffefa}.choice{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:11px;border-bottom:1px solid var(--l);background:#fffefa;cursor:grab}.choice.drag{opacity:.4}.toggle{width:34px;accent-color:var(--g)}.notice{background:#e8f0f8;border-left:3px solid #6680ab;padding:13px;color:var(--n);line-height:1.5}.modal{display:none;position:fixed;inset:0;background:#143d6a77;place-items:center;padding:20px}.modal.open{display:grid}.dialog{width:min(620px,100%);background:#fff;border-radius:8px;padding:22px}.toast{position:fixed;right:22px;bottom:22px;background:#f1f7f3;border:1px solid var(--g);color:#1a5030;padding:12px;opacity:0;transform:translateY(80px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.wrap{padding:24px 14px}.top{padding:0 14px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.profile{grid-template-columns:42px 1fr 24px}.profile .hide{display:none}.profilehead{align-items:flex-start}.actions{margin:68px 0 0 -76px}}
</style></head><body><header class="top"><div><span class="brand">WERK TRIFFT</span> – Profilmanagement</div><div class="sub" id="connection">Lokaler Arbeitsmodus</div></header><main class="wrap"><section id="dashboard"><div class="row"><div><h1>Beraterprofile</h1><p class="intro">Interne Profilakten pflegen und kundenbezogene Varianten zusammenstellen.</p></div><button class="button" onclick="openModal()">+ Neues Profil</button></div><section class="card"><div class="head"><h3>Profilakten</h3><h2>Alle Profile</h2></div><div id="profiles"></div><div class="body muted" id="footer"></div></section></section><section id="workspace" style="display:none"><div class="profilehead"><div class="avatar" id="initials">–</div><div><div class="row" style="justify-content:start"><h1 id="fullname">–</h1><span class="status" id="pstatus">–</span></div><p class="intro" id="role"></p></div><div class="actions"><button class="button secondary" onclick="dashboard()">← Übersicht</button><button class="button" onclick="newVariant()">+ Variante</button></div></div><nav class="tabs"><button class="tab active" data-tab="overview">Übersicht</button><button class="tab" data-tab="contents">Profilinhalte</button><button class="tab" data-tab="variants">Varianten</button><button class="tab" data-tab="documents">Dokumente</button></nav><div class="view active" id="overview"></div><div class="view" id="contents"></div><div class="view" id="variants"></div><div class="view" id="documents"></div></section></main><div class="modal" id="modal"><div class="dialog"><div class="row"><h2>Neues Profil anlegen</h2><button class="button secondary" onclick="closeModal()">×</button></div><p class="intro">Startet als Entwurf. Fehlende Felder können später ergänzt werden.</p><div class="fields"><div class="field"><label>Vorname</label><input id="first"></div><div class="field"><label>Nachname</label><input id="last"></div><div class="field wide"><label>Aktuelle Rolle</label><input id="newrole"></div></div><p style="text-align:right"><button class="button" onclick="createProfile()">Profil anlegen</button></p></div></div><div class="toast" id="toast"></div><script>
const actor='Julius Rollmann';let profile=null,variant=null,drag=null;const q=s=>document.querySelector(s),e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-WT-Actor':actor},body:data?JSON.stringify(data):undefined}),j=await r.json();if(!r.ok)throw Error(j.fehler);return j}function say(s){q('#toast').textContent=s;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),2600)}function st(s){return '<span class="status '+e(s).replaceAll(' ','-')+'">'+e(s)+'</span>'}async function load(){try{let a=(await api('/profiles')).profile;q('#connection').textContent='JSON-Speicherung aktiv';q('#profiles').innerHTML=a.map(x=>'<button class="profile" onclick="openProfile(\''+e(x.id)+'\')"><div class="avatar">'+e(x.name.split(' ').map(y=>y[0]).join('').slice(0,2))+'</div><div><div class="name">'+e(x.name)+'</div><div class="muted">'+e(x.rolle||'Rolle noch ergänzen')+'</div></div><div class="hide">'+st(x.status)+'</div><div>›</div></button>').join('')||'<div class="body muted">Noch keine Profile angelegt.</div>';q('#footer').textContent=a.length+' Profilakte'+(a.length===1?'':'n')}catch(x){q('#connection').textContent='Server nicht erreichbar';say('Server nicht erreichbar. Bitte profilmanagement-server.py starten.')}}async function openProfile(id){profile=await api('/profiles/'+id);q('#dashboard').style.display='none';q('#workspace').style.display='block';render();tab('overview')}function render(){let p=profile,person=p.person;q('#initials').textContent=(person.vorname[0]+person.nachname[0]).toUpperCase();q('#fullname').textContent=person.vorname+' '+person.nachname;q('#role').textContent=person.rolle||'Rolle noch ergänzen';q('#pstatus').className='status '+p.status.replaceAll(' ','-');q('#pstatus').textContent=p.status;q('#overview').innerHTML='<section class="section"><h3>Profilkern</h3><div><p><b>'+e(p.kurzprofil.positionierung||'Positionierung noch ergänzen')+'</b></p><p>'+e(p.kurzprofil.zusammenfassung||'Für dieses Profil liegt noch keine Zusammenfassung vor.')+'</p></div></section><section class="section"><h3>Prüfhinweise</h3><div class="notice">'+(p.hinweise.length?p.hinweise.map(e).join('<br>'):'Keine offenen Hinweise.')+'</div></section>';contents()}function item(x,type){let v=type==='language'?[x.sprache,x.niveau]:[x.bezeichnung,x.details||''];return '<div class="item" data-id="'+e(x.id||'')+'"><input value="'+e(v[0])+'">'+(type==='language'?'<input value="'+e(v[1])+'">':'')+'<button class="remove" onclick="this.parentElement.remove()">×</button></div>'}function list(title,key,type='item'){return '<section class="section"><h3>'+title+'</h3><div><div id="'+key+'">'+(profile[key]||[]).map(x=>item(x,type)).join('')+'</div><button class="add" onclick="add(\''+key+'\',\''+type+'\')">+ hinzufügen</button></div></section>'}function contents(){let p=profile;q('#contents').innerHTML='<div class="row"><h2>Profilinhalte</h2><button class="button" onclick="save()">Änderungen speichern</button></div><section class="section"><h3>Stammdaten</h3><div class="fields">'+[['vorname','Vorname'],['nachname','Nachname'],['rolle','Aktuelle Rolle'],['standort','Standort'],['interneEmail','Interne E-Mail'],['telefon','Telefonnummer']].map(x=>'<div class="field"><label>'+x[1]+'</label><input data-p="'+x[0]+'" value="'+e(p.person[x[0]]||'')+'"></div>').join('')+'</div></section><section class="section"><h3>Kurzprofil</h3><div><div class="field"><label>Positionierung</label><textarea id="pos">'+e(p.kurzprofil.positionierung||'')+'</textarea></div><div class="field"><label>Zusammenfassung</label><textarea id="sum">'+e(p.kurzprofil.zusammenfassung||'')+'</textarea></div></div></section>'+list('Kompetenzen','kompetenzen')+list('Branchen','branchen')+list('Qualifikationen & Zertifikate','qualifikationen')+list('Sprachen','sprachen','language')}function add(k,t){q('#'+k).insertAdjacentHTML('beforeend',item({id:'',bezeichnung:'',sprache:'',niveau:''},t))}function collect(k,t){return [...q('#'+k).children].map(r=>{let x=[...r.querySelectorAll('input')].map(i=>i.value.trim());return t==='language'?{id:r.dataset.id||crypto.randomUUID(),sprache:x[0],niveau:x[1]}:{id:r.dataset.id||crypto.randomUUID(),bezeichnung:x[0],details:x[1]||''}}).filter(x=>t==='language'?x.sprache:x.bezeichnung)}async function save(){let person={};q('#contents').querySelectorAll('[data-p]').forEach(x=>person[x.dataset.p]=x.value.trim());profile=await api('/profiles/'+profile.id,'PUT',{status:profile.status,person,kurzprofil:{positionierung:q('#pos').value.trim(),zusammenfassung:q('#sum').value.trim()},kompetenzen:collect('kompetenzen','item'),branchen:collect('branchen','item'),qualifikationen:collect('qualifikationen','item'),sprachen:collect('sprachen','language'),projekte:profile.projekte});render();load();say('Basisprofil gespeichert. Varianten sind zur Prüfung markiert.')}function selection(k){return(profile[k]||[]).map((x,i)=>({id:x.id,sichtbar:true,reihenfolge:i+1}))}async function newVariant(){variant=await api('/profiles/'+profile.id+'/variants','POST',{name:'Neue Profilvariante',zielrolle:profile.person.rolle,auswahl:{kompetenzen:selection('kompetenzen'),qualifikationen:selection('qualifikationen'),sprachen:selection('sprachen'),branchen:selection('branchen'),projekte:selection('projekte')}});tab('variants');variants(true)}async function variants(edit=false){let vs=(await api('/profiles/'+profile.id+'/variants')).varianten;if(!edit||!variant){q('#variants').innerHTML='<div class="row"><h2>Varianten</h2><button class="button" onclick="newVariant()">+ Variante</button></div><section class="section">'+(vs.map(x=>'<div class="body" style="border-bottom:1px solid var(--l);cursor:pointer" onclick="openVariant(\''+e(x.id)+'\')"><b>'+e(x.name)+'</b><br>'+st(x.status)+'</div>').join('')||'<div class="body muted">Noch keine Variante angelegt.</div>')+'</section>';return}let v=variant;q('#variants').innerHTML='<div class="row"><h2>Variante bearbeiten</h2><button class="button secondary" onclick="variant=null;variants()">← Varianten</button></div><section class="section"><div class="fields"><div class="field"><label>Name</label><input id="vn" value="'+e(v.name)+'"></div><div class="field"><label>Zielrolle</label><input id="vr" value="'+e(v.zielrolle)+'"></div></div></section>'+['kompetenzen','qualifikationen','sprachen','branchen'].map(k=>choices(k)).join('')+'<p style="text-align:right"><button class="button secondary" onclick="saveVariant(\'Entwurf\')">Entwurf speichern</button> <button class="button" onclick="saveVariant(\'Freigegeben\')">Freigeben</button></p>';dnd()}async function openVariant(id){variant=await api('/profiles/'+profile.id+'/variants/'+id);variants(true)}function choices(k){let a=[...(variant.auswahl[k]||[])].sort((a,b)=>a.reihenfolge-b.reihenfolge);let label={kompetenzen:'Kompetenzen',qualifikationen:'Qualifikationen',sprachen:'Sprachen',branchen:'Branchen'}[k];return '<section class="section"><h3>'+label+' · ziehen zum Priorisieren</h3><div class="choices" data-k="'+k+'">'+a.map(x=>{let y=(profile[k]||[]).find(z=>z.id===x.id)||{};return '<div class="choice" draggable="true" data-id="'+e(x.id)+'"><span>⠿</span><b>'+e(y.sprache||y.bezeichnung||'Nicht mehr vorhanden')+'</b><input class="toggle" type="checkbox" '+(x.sichtbar?'checked':'')+'></div>'}).join('')+'</div></section>'}function dnd(){q('#variants').querySelectorAll('.choice').forEach(x=>{x.ondragstart=()=>{drag=x;x.classList.add('drag')};x.ondragend=()=>x.classList.remove('drag');x.ondragover=e=>{e.preventDefault();let r=x.getBoundingClientRect();x.parentElement.insertBefore(drag,e.clientY<r.top+r.height/2?x:x.nextSibling)}})}async function saveVariant(status){let auswahl={};q('#variants').querySelectorAll('.choices').forEach(x=>auswahl[x.dataset.k]=[...x.children].map((y,i)=>({id:y.dataset.id,sichtbar:y.querySelector('input').checked,reihenfolge:i+1})));variant=await api('/profiles/'+profile.id+'/variants/'+variant.id,'PUT',{name:q('#vn').value.trim()||'Unbenannte Variante',zielrolle:q('#vr').value.trim(),status,auswahl});variants(true);load();say(status==='Freigegeben'?'Variante freigegeben.':'Variantenentwurf gespeichert.')}function tab(id){q('.tab.active').classList.remove('active');q('[data-tab="'+id+'"]').classList.add('active');q('.view.active').classList.remove('active');q('#'+id).classList.add('active');if(id==='variants')variants();if(id==='documents')q('#documents').innerHTML='<section class="section"><h3>Dokumente & Historie</h3><div class="notice">Dateiupload und Dokumentablage folgen nach dem Test dieses Kerns.</div></section>'}document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));function dashboard(){q('#workspace').style.display='none';q('#dashboard').style.display='block';load()}function openModal(){q('#modal').classList.add('open')}function closeModal(){q('#modal').classList.remove('open')}async function createProfile(){try{let p=await api('/profiles','POST',{person:{vorname:q('#first').value.trim(),nachname:q('#last').value.trim(),rolle:q('#newrole').value.trim()}});closeModal();load();openProfile(p.id);tab('contents');say('Profilentwurf angelegt.')}catch(x){say(x.message)}}load();
</script></body></html>
