<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WERK TRIFFT – Profilmanagement</title><style>:root{--blue:#143d6a;--orange:#d76f23;--paper:#f9f6ef;--white:#fff;--cream:#fffefa;--line:#c8bea8;--ink:#2b2b2b;--muted:#66758a;--green:#3d6e56;--red:#832233;--soft:#e8f0f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px Arial,sans-serif}.top{height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:var(--blue);border-bottom:3px solid var(--orange);color:white}.brand{font-weight:800;letter-spacing:.07em}.sub{font-size:12px;color:#cfdae9}.wrap{max-width:1320px;margin:auto;padding:34px 28px 70px}h1{margin:0;font-size:30px}h2{margin:0;font-size:18px}h3,label{font:11px monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.intro,.muted{color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.card,.section,.profilehead{background:var(--white);border:1px solid var(--line);border-radius:8px;overflow:hidden}.card{margin-top:26px}.head,.body{padding:18px}.head{border-bottom:1px solid var(--line)}button{font:inherit}.button{border:0;border-radius:5px;padding:10px 14px;background:var(--orange);color:#fff;font-weight:bold;cursor:pointer}.button.secondary,.add{background:#f0ebe0;color:var(--blue);border:1px solid var(--line)}.button:disabled{opacity:.48;cursor:not-allowed}.profile{width:100%;border:0;border-bottom:1px solid var(--line);background:var(--cream);text-align:left;padding:16px 18px;display:grid;grid-template-columns:42px 1fr 145px 24px;gap:13px;align-items:center;cursor:pointer}.profile:hover,.variantline:hover{background:#f7f2e8}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e6ecf5;color:var(--blue);font-weight:bold}.name{font-weight:bold}.status{display:inline-block;padding:4px 7px;width:max-content;font:11px monospace;background:#fef0e0;color:#9a6800}.Aktuell,.Freigegeben{background:#e0ece5;color:var(--green)}.Prüfung-erforderlich{background:#fff1d9;color:#9a6800}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:22px}.tab{border:0;background:transparent;padding:13px 2px;border-bottom:3px solid transparent;font-weight:bold;color:var(--muted);cursor:pointer}.tab.active{border-color:var(--orange);color:var(--blue)}.view{display:none;padding-top:22px}.view.active{display:block}.profilehead{padding:22px;display:flex;gap:16px;align-items:center}.profilehead .avatar{width:60px;height:60px;font-size:18px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.section{margin-bottom:16px}.section>h3{display:block;padding:14px 17px;margin:0;border-bottom:1px solid var(--line)}.section>div{padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}input,textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:4px;background:var(--cream);font:inherit}textarea{min-height:80px}.item{display:flex;gap:8px;margin:7px 0}.item input{flex:1}.remove{border:0;background:#f8e7e3;color:var(--red);padding:5px 9px;cursor:pointer}.add{margin-top:8px;padding:8px 10px;border-radius:4px;font-weight:bold;cursor:pointer}.notice{background:var(--soft);border-left:3px solid #6680ab;padding:13px;color:var(--blue);line-height:1.5}.warning{background:#fff8ec;border-left-color:var(--orange)}.variantline{padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer}.meta{font-size:12px;color:var(--muted);margin-top:5px}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.summary-item{padding-bottom:8px;border-bottom:1px solid #eee8dc}.project{margin:12px 0;border:1px solid var(--line);border-left:4px solid var(--orange);border-radius:5px;background:var(--cream);overflow:hidden}.project-head{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid #e5ddcf}.project-title{flex:1;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px;background:transparent;color:var(--blue);font-size:16px;font-weight:700}.project-title:focus{outline:none;border-bottom-color:var(--orange)}.project-body{padding:13px}.months{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.check{display:flex;align-items:center;gap:7px;white-space:nowrap;padding:9px 0;color:var(--ink);font:inherit;text-transform:none;letter-spacing:0}.check input{width:auto}.duration{font-size:12px}.choice{display:grid;grid-template-columns:22px 48px 1fr 30px 30px;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--cream)}.choice.off{opacity:.52;background:#f4f1eb}.choice.drag{opacity:.3}.choice-text{min-width:0}.choice-title{font-weight:bold}.choice-text .meta{display:block;margin-top:3px}.grip{color:var(--muted);cursor:grab;font-size:18px;letter-spacing:-3px;user-select:none}.toggle{position:relative;display:inline-block;width:38px;height:22px}.toggle input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#aab3bb;border-radius:20px;cursor:pointer}.slider:before{content:'';position:absolute;width:16px;height:16px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.2s}.toggle input:checked+.slider{background:var(--green)}.toggle input:checked+.slider:before{transform:translateX(16px)}.arrow{border:0;background:#e6ecf5;color:var(--blue);width:28px;height:28px;cursor:pointer;font-weight:bold}.arrow:disabled{opacity:.25;cursor:not-allowed}.variant-project{background:var(--cream);border-bottom:1px solid var(--line)}.variant-project .choice{border-bottom:0}.project-summary{margin:0 14px 12px 78px;padding:10px 12px;background:#fff;border-left:2px solid #dbe5f1;color:var(--muted);font-size:12px;line-height:1.5}.base-save-bar{display:flex;justify-content:flex-end;margin:18px 0 24px}.save-bar{position:sticky;bottom:12px;display:flex;justify-content:flex-end;gap:8px;padding:12px 0;background:linear-gradient(transparent,var(--paper) 25%)}.danger{background:#f8e7e3!important;color:var(--red)!important;border:1px solid #e6c6bd!important}.variant-summary{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}.variant-summary b{display:block;color:var(--ink);font-size:13px}.status-box{padding:14px 16px;background:#f7f2e8;border-left:4px solid var(--orange);margin-bottom:16px}.status-box.good{background:#f1f7f3;border-left-color:var(--green)}.status-title{font-weight:bold;color:var(--blue);margin-bottom:3px}.preview{margin-top:16px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}.preview-head{padding:16px;border-bottom:1px solid var(--line);background:#f7f2e8}.preview-head h2{margin:0 0 4px}.preview-body{padding:20px}.preview-section{padding:13px 0;border-bottom:1px solid #e7e1d6}.preview-section:last-child{border-bottom:0}.preview-section h3{margin:0 0 8px}.preview-project{padding:12px 0;border-top:1px solid #ece6db}.preview-project:first-of-type{border-top:0}.preview-project b{color:var(--blue)}.modal{display:none;position:fixed;inset:0;background:#143d6a77;place-items:center;padding:20px;z-index:2}.modal.open{display:grid}.dialog{width:min(620px,100%);background:#fff;border-radius:8px;padding:22px}.toast{position:fixed;right:22px;bottom:22px;background:#f1f7f3;border:1px solid var(--green);color:#1a5030;padding:12px;opacity:0;transform:translateY(80px);transition:.2s;z-index:3}.toast.show{opacity:1;transform:none}@media(max-width:700px){.wrap{padding:24px 14px}.top{padding:0 14px}.fields,.months,.summary-grid,.variant-summary{grid-template-columns:1fr}.wide{grid-column:auto}.profile{grid-template-columns:42px 1fr 24px}.profile .hide{display:none}.profilehead{align-items:flex-start}.actions{margin:10px 0 0}.tabs{gap:14px;overflow:auto}.choice{grid-template-columns:20px 45px 1fr 27px 27px}.project-summary{margin-left:14px}.check{padding:0}}</style></head><body><header class="top"><div><span class="brand">WERK TRIFFT</span> – Profilmanagement</div><div class="sub" id="connection">Lokaler Arbeitsmodus</div></header><main class="wrap"><section id="dashboard"><div class="row"><div><h1>Beraterprofile</h1><p class="intro">Basisprofile pflegen und kundenbezogene Varianten zusammenstellen.</p></div><button class="button" onclick="openModal()">+ Neues Profil</button></div><section class="card"><div class="head"><h3>Profilakten</h3><h2>Alle Profile</h2></div><div id="profiles"></div><div class="body muted" id="footer"></div></section></section><section id="workspace" hidden><div class="profilehead"><div class="avatar" id="initials">–</div><div><div class="row" style="justify-content:start"><h1 id="fullname">–</h1><span class="status" id="pstatus">–</span></div><p class="intro" id="role"></p></div><div class="actions"><button class="button secondary" onclick="dashboard()">← Übersicht</button><button class="button" onclick="newVariant()">+ Neue Variante anlegen</button></div></div><nav class="tabs"><button class="tab active" data-tab="overview">Übersicht</button><button class="tab" data-tab="base">Basisprofil</button><button class="tab" data-tab="variants">Varianten</button><button class="tab" data-tab="documents">Dokumente</button></nav><div class="view active" id="overview"></div><div class="view" id="base"></div><div class="view" id="variants"></div><div class="view" id="documents"></div></section></main><div class="modal" id="modal"><div class="dialog"><div class="row"><h2>Neues Profil anlegen</h2><button class="button secondary" onclick="closeModal()">×</button></div><p class="intro">Startet als Entwurf. Fehlende Felder können später ergänzt werden.</p><div class="fields"><div class="field"><label>Vorname</label><input id="first"></div><div class="field"><label>Nachname</label><input id="last"></div><div class="field wide"><label>Aktuelle Rolle</label><input id="newrole"></div></div><p style="text-align:right"><button class="button" onclick="createProfile()">Profil anlegen</button></p></div></div><div class="toast" id="toast"></div><script>const actor='Julius Rollmann',listKeys=['kompetenzen','branchen','qualifikationen','sprachen'],allKeys=[...listKeys,'projekte'];let profile=null,variant=null,drag=null;const q=s=>document.querySelector(s),qa=(s,root=document)=>[...root.querySelectorAll(s)],e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const labels={kompetenzen:'Kompetenzen',branchen:'Branchen',qualifikationen:'Qualifikationen & Zertifikate',sprachen:'Sprachen',projekte:'Projekterfahrung'};async function api(path,method='GET',data){let response=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-WT-Actor':actor},body:data?JSON.stringify(data):undefined}),json=await response.json();if(!response.ok)throw Error(json.fehler);return json}function say(message){q('#toast').textContent=message;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),3000)}function badge(status){return `<span class="status ${e(status).replaceAll(' ','-')}">${e(status)}</span>`}function month(value){return value?value.slice(5,7)+'/'+value.slice(0,4):''}function duration(p){if(!p.startMonat)return'';if(p.laufend)return'laufend';if(!p.endeMonat)return'';let[a,b]=p.startMonat.split('-').map(Number),[c,d]=p.endeMonat.split('-').map(Number),n=(c-a)*12+d-b+1;return n>0?`${n} Monat${n===1?'':'e'}`:''}async function load(){try{let profiles=(await api('/profiles')).profile;q('#connection').textContent='JSON-Speicherung aktiv';q('#profiles').innerHTML=profiles.map(x=>`<button class="profile" onclick="openProfile('${e(x.id)}')"><div class="avatar">${e(x.name.split(' ').map(y=>y[0]).join('').slice(0,2))}</div><div><div class="name">${e(x.name)}</div><div class="muted">${e(x.rolle||'Rolle noch ergänzen')}</div></div><div class="hide">${badge(x.status)}</div><div>›</div></button>`).join('')||'<div class="body muted">Noch keine Profile angelegt.</div>';q('#footer').textContent=profiles.length+' Profilakte'+(profiles.length===1?'':'n')}catch(error){q('#connection').textContent='Server nicht erreichbar';say('Server nicht erreichbar. Bitte profilmanagement-server.py starten.')}}async function openProfile(id){profile=await api('/profiles/'+id);variant=null;q('#dashboard').hidden=true;q('#workspace').hidden=false;render();tab('overview')}function summary(key){let rows=profile[key]||[];let titles=rows.slice(0,4).map(row=>key==='sprachen'?`${row.sprache}${row.niveau?' · '+row.niveau:''}`:key==='projekte'?row.titel:row.bezeichnung).filter(Boolean).map(e).join(' · ');return titles+(rows.length>4?` +${rows.length-4}`:'')||'—'}function render(){let p=profile;q('#initials').textContent=(p.person.vorname[0]+p.person.nachname[0]).toUpperCase();q('#fullname').textContent=p.person.vorname+' '+p.person.nachname;q('#role').textContent=p.person.rolle||'Rolle noch ergänzen';q('#pstatus').className='status '+p.status.replaceAll(' ','-');q('#pstatus').textContent=p.status;q('#overview').innerHTML=`<section class="section"><h3>Basisprofil</h3><div><p><b>${e(p.kurzprofil.positionierung||'Positionierung noch ergänzen')}</b></p><p>${e(p.kurzprofil.zusammenfassung||'Für dieses Basisprofil liegt noch keine Zusammenfassung vor.')}</p></div></section><section class="section"><h3>Inhalte im Basisprofil</h3><div class="summary-grid">${allKeys.map(key=>`<div class="summary-item"><label>${labels[key]}</label><div>${summary(key)}</div></div>`).join('')}</div></section><section class="section"><h3>Prüfhinweise</h3><div class="notice">${p.hinweise.length?p.hinweise.map(e).join('<br>'):'Keine offenen Hinweise.'}</div></section>`;renderBase()}function baseItem(row,key){let first=key==='sprachen'?row.sprache:row.bezeichnung,second=key==='sprachen'?row.niveau:'';return `<div class="item" data-id="${e(row.id||'')}"><input value="${e(first||'')}" oninput="baseChanged()" placeholder="${key==='sprachen'?'Sprache':'Bezeichnung'}">${key==='sprachen'?`<input value="${e(second||'')}" oninput="baseChanged()" placeholder="Niveau, z. B. C1">`:''}<button class="remove" onclick="this.parentElement.remove();baseChanged()">×</button></div>`}function addBase(key){q('#base-'+key).insertAdjacentHTML('beforeend',baseItem({},key));q('#base-'+key).lastElementChild.querySelector('input').focus();baseChanged()}function collectBase(key){return qa('#base-'+key+' .item').map(row=>{let values=qa('input',row).map(input=>input.value.trim());return key==='sprachen'?{id:row.dataset.id||crypto.randomUUID(),sprache:values[0],niveau:values[1]}:{id:row.dataset.id||crypto.randomUUID(),bezeichnung:values[0],details:''}}).filter(row=>key==='sprachen'?row.sprache:row.bezeichnung)}function baseList(key){return `<section class="section"><h3>${labels[key]}</h3><div><div id="base-${key}">${(profile[key]||[]).map(row=>baseItem(row,key)).join('')}</div><button class="add" onclick="addBase('${key}')">+ hinzufügen</button>${key==='sprachen'?'<p class="muted" style="font-size:12px">Sprache und Niveau getrennt erfassen, z. B. „Englisch“ und „C1“.</p>':''}</div></section>`}function projectCard(p={}){return `<article class="project" data-id="${e(p.id||'')}"><div class="project-head"><input class="project-title" data-project="titel" value="${e(p.titel||'')}" oninput="baseChanged()" placeholder="Projekttitel eingeben"><button class="remove" onclick="this.closest('.project').remove();baseChanged()">Projekt entfernen</button></div><div class="project-body"><div class="fields"><div class="months wide"><div class="field"><label>Startmonat</label><input type="month" data-project="startMonat" value="${e(p.startMonat||'')}" oninput="updateDuration(this);baseChanged()"></div><div class="field"><label>Endmonat</label><input type="month" data-project="endeMonat" value="${e(p.endeMonat||'')}" ${p.laufend?'disabled':''} oninput="updateDuration(this);baseChanged()"></div><label class="check"><input type="checkbox" data-project="laufend" ${p.laufend?'checked':''} onchange="toggleRunning(this);baseChanged()"> laufend</label></div><div class="wide muted duration">${duration(p)?'Dauer: '+e(duration(p)):'Dauer wird aus Start und Ende berechnet.'}</div><div class="field wide"><label>Rolle</label><input data-project="rolle" value="${e(p.rolle||'')}" oninput="baseChanged()" placeholder="z. B. Projektmanagerin"></div><div class="field wide"><label>Kurzbeschreibung</label><textarea data-project="beschreibung" oninput="baseChanged()" placeholder="Ausgangslage und Auftrag in zwei bis vier klaren Sätzen.">${e(p.beschreibung||'')}</textarea></div><div class="field wide"><label>Tätigkeiten</label><textarea data-project="aufgaben" oninput="baseChanged()" placeholder="Konkrete eigene Aufgaben und Verantwortungen.">${e(p.aufgaben||'')}</textarea></div></div></div></article>`}function addProject(){q('#base-projekte').insertAdjacentHTML('beforeend',projectCard());q('#base-projekte').lastElementChild.querySelector('[data-project=titel]').focus();baseChanged()}function readProject(row){let get=key=>row.querySelector(`[data-project="${key}"]`);return{id:row.dataset.id||crypto.randomUUID(),titel:get('titel').value.trim(),startMonat:get('startMonat').value,endeMonat:get('endeMonat').value,laufend:get('laufend').checked,rolle:get('rolle').value.trim(),beschreibung:get('beschreibung').value.trim(),aufgaben:get('aufgaben').value.trim()}}function toggleRunning(box){let end=box.closest('.project').querySelector('[data-project=endeMonat]');end.disabled=box.checked;if(box.checked)end.value='';updateDuration(box)}function updateDuration(element){let card=element.closest('.project'),p=readProject(card);card.querySelector('.duration').textContent=duration(p)?'Dauer: '+duration(p):'Dauer wird aus Start und Ende berechnet.'}function collectProjects(){return qa('#base-projekte .project').map(readProject)}function baseChanged(){q('#base-save').disabled=false}function renderBase(){let p=profile;q('#base').innerHTML=`<div class="row"><div><h2>Basisprofil</h2><p class="intro">Änderungen am Basisprofil speicherst du oben mit einem Klick. Ein vollständig leeres neues Projekt wird dabei nicht übernommen; angefangene Projekte müssen vollständig ergänzt werden.</p></div></div><div class="base-save-bar"><button id="base-save" class="button" onclick="saveBase()">Basisprofil speichern</button></div><section class="section"><h3>Stammdaten</h3><div class="fields">${[['vorname','Vorname'],['nachname','Nachname'],['rolle','Aktuelle Rolle'],['standort','Standort'],['interneEmail','Interne E-Mail'],['telefon','Telefonnummer']].map(x=>`<div class="field"><label>${x[1]}</label><input data-person="${x[0]}" value="${e(p.person[x[0]]||'')}" oninput="baseChanged()"></div>`).join('')}</div></section><section class="section"><h3>Kurzprofil</h3><div class="fields"><div class="field wide"><label>Positionierung</label><textarea id="pos" oninput="baseChanged()">${e(p.kurzprofil.positionierung||'')}</textarea></div><div class="field wide"><label>Zusammenfassung</label><textarea id="sum" oninput="baseChanged()">${e(p.kurzprofil.zusammenfassung||'')}</textarea></div></div></section>${listKeys.map(baseList).join('')}<section class="section"><h3>Projekterfahrung</h3><div><p class="muted">Jedes Projekt wird im Basisprofil gepflegt. Der fett dargestellte Titel oben ist direkt editierbar.</p><div id="base-projekte">${(p.projekte||[]).map(projectCard).join('')}</div><button class="add" onclick="addProject()">+ Projekt hinzufügen</button></div></section>`}async function saveBase(){let person={};qa('[data-person]').forEach(input=>person[input.dataset.person]=input.value.trim());try{profile=await api('/profiles/'+profile.id,'PUT',{status:profile.status,person,kurzprofil:{positionierung:q('#pos').value.trim(),zusammenfassung:q('#sum').value.trim()},...Object.fromEntries(listKeys.map(key=>[key,collectBase(key)])),projekte:collectProjects()});render();load();say('Basisprofil gespeichert. Betroffene Varianten sind zur Prüfung markiert.')}catch(error){say(error.message)}}async function newVariant(){variant=await api('/profiles/'+profile.id+'/variants','POST',{name:'Neue Profilvariante',zielrolle:profile.person.rolle});tab('variants');variants(true);say('Neue Variante angelegt. Namen vergeben und Änderungen speichern.')}async function openVariant(id){variant=await api('/profiles/'+profile.id+'/variants/'+id);variants(true)}function entries(key){let selected=Object.fromEntries((variant.auswahl?.[key]||[]).map(row=>[row.id,row]));return(profile[key]||[]).map((row,index)=>({...row,sichtbar:selected[row.id]?.sichtbar===true,reihenfolge:selected[row.id]?.reihenfolge??index+1})).sort((a,b)=>a.reihenfolge-b.reihenfolge)}function choice(key,row,index,total){let title=key==='sprachen'?`${row.sprache||''} · ${row.niveau||'Niveau nicht angegeben'}`:key==='projekte'?row.titel:row.bezeichnung;let meta=key==='projekte'?[month(row.startMonat),row.laufend?'laufend':month(row.endeMonat),row.rolle].filter(Boolean).join(' · '):'';let summary=key==='projekte'?`<div class="project-summary"><b>Kurzbeschreibung:</b> ${e(row.beschreibung||'Noch nicht beschrieben.')}<br><b>Tätigkeiten:</b> ${e(row.aufgaben||'Noch nicht beschrieben.')}</div>`:'';return `<article class="${key==='projekte'?'variant-project':''}"><div class="choice ${row.sichtbar?'':'off'}" draggable="true" data-id="${e(row.id)}"><span class="grip" title="Ziehen zum Priorisieren">⠿</span><label class="toggle" title="In dieser Variante ein-/ausschalten"><input type="checkbox" ${row.sichtbar?'checked':''} onchange="toggleChoice(this)"><span class="slider"></span></label><span class="choice-text"><span class="choice-title">${e(title||'Ohne Bezeichnung')}</span>${meta?`<span class="meta">${e(meta)}</span>`:''}</span><button class="arrow" onclick="moveChoice(this,-1)" ${index===0?'disabled':''}>↑</button><button class="arrow" onclick="moveChoice(this,1)" ${index===total-1?'disabled':''}>↓</button></div>${summary}</article>`}function choiceSection(key){let rows=entries(key);return `<section class="section"><h3>${labels[key]} · ein-/ausschalten und priorisieren</h3><div class="choices" data-key="${key}">${rows.map((row,index)=>choice(key,row,index,rows.length)).join('')||'<p class="muted">Im Basisprofil sind noch keine Einträge vorhanden.</p>'}</div></section>`}function statusInfo(v){if(v.pruefungErforderlich)return{title:'Prüfung erforderlich',text:'Das Basisprofil wurde verändert. Bitte Auswahl und Reihenfolge kontrollieren.',cls:''};if(v.status==='Freigegeben')return{title:'Freigegeben',text:'Diese Variante ist als verwendbare Fassung gekennzeichnet.',cls:'good'};return{title:'In Arbeit',text:'Die Variante kann weiter bearbeitet werden. Speichern sichert den aktuellen Stand.',cls:''}}function selectionCount(v){let visible=0,total=0;allKeys.forEach(key=>{let a=v.auswahl?.[key]||[];total+=a.length;visible+=a.filter(x=>x.sichtbar).length});return{visible,total}}function variantListInfo(v){let count=selectionCount(v),projects=(v.inhalte?.projekte||[]).filter(p=>(v.auswahl?.projekte||[]).find(x=>x.id===p.id&&x.sichtbar)).slice(0,2).map(p=>p.titel).filter(Boolean).join(' · ');return `<div class="variant-summary"><span><label>Kunde / Anfrage</label><b>${e(v.kunde||v.anfrage||'Noch nicht ergänzt')}</b></span><span><label>Auswahl</label><b>${count.visible} von ${count.total} Einträgen</b></span><span><label>Projekte</label><b>${e(projects||'Keine ausgewählt')}</b></span></div>`}async function variants(edit=false){let list=(await api('/profiles/'+profile.id+'/variants')).varianten;if(!edit||!variant){q('#variants').innerHTML=`<div class="row"><div><h2>Varianten</h2><p class="intro">Jede Variante ist eine eigene gespeicherte Fassung. Sie kann unabhängig bearbeitet, freigegeben oder entfernt werden.</p></div><button class="button" onclick="newVariant()">+ Neue Variante anlegen</button></div><section class="section">${list.map(item=>`<div class="variantline" onclick="openVariant('${e(item.id)}')"><div class="row" style="align-items:start"><div><b>${e(item.name)}</b><div class="meta">${e(item.zielrolle||'Zielrolle noch ergänzen')}</div></div>${badge(statusInfo(item).title)}</div>${variantListInfo(item)}</div>`).join('')||'<div class="body muted">Noch keine Variante angelegt.</div>'}</section>`;return}let state=statusInfo(variant);q('#variants').innerHTML=`<div class="row"><div><h2>Variante bearbeiten</h2><p class="intro">Die Variante steuert nur Auswahl und Reihenfolge. Inhalte kommen aus dem Basisprofil.</p></div><div><button class="button secondary" onclick="variant=null;variants()">← Variantenliste</button><button class="button danger" onclick="removeVariant()">Variante entfernen</button></div></div><div class="status-box ${state.cls}"><div class="status-title">Status: ${e(state.title)}</div><div class="muted">${e(state.text)}</div>${variant.pruefungErforderlich?'<p style="margin:10px 0 0"><button class="button secondary" onclick="finishReview()">Änderungen im Basisprofil bestätigen</button></p>':''}</div><section class="section"><h3>Kontext der Variante</h3><div class="fields"><div class="field"><label>Name der Variante</label><input id="vn" oninput="variantChanged()" value="${e(variant.name)}"></div><div class="field"><label>Zielrolle</label><input id="vr" oninput="variantChanged()" value="${e(variant.zielrolle||'')}"></div><div class="field"><label>Kunde</label><input id="vk" oninput="variantChanged()" value="${e(variant.kunde||'')}"></div><div class="field"><label>Anfrage / Projekt</label><input id="va" oninput="variantChanged()" value="${e(variant.anfrage||'')}"></div></div></section>${allKeys.map(choiceSection).join('')}<div class="save-bar"><button class="button secondary" onclick="showPreview()">Vorschau anzeigen</button><button id="variant-save" class="button" onclick="saveVariant(false)" disabled>Entwurf speichern</button><button class="button" onclick="saveVariant(true)">Freigabe erteilen</button></div><div id="variant-preview"></div>`;dnd()}function variantChanged(){q('#variant-save').disabled=false;let preview=q('#variant-preview');if(preview.innerHTML)showPreview()}function toggleChoice(box){box.closest('.choice').classList.toggle('off',!box.checked);variantChanged()}function moveChoice(button,delta){let card=button.closest('article'),sibling=delta<0?card.previousElementSibling:card.nextElementSibling;if(sibling){card.parentElement.insertBefore(card,delta<0?sibling:sibling.nextSibling);refreshArrows(card.parentElement);variantChanged()}}function refreshArrows(parent){qa('.choice',parent).forEach((choice,index,all)=>{let arrows=qa('.arrow',choice);arrows[0].disabled=index===0;arrows[1].disabled=index===all.length-1})}function dnd(){qa('.choice').forEach(choice=>{choice.ondragstart=()=>{drag=choice.closest('article');choice.classList.add('drag')};choice.ondragend=()=>choice.classList.remove('drag');choice.ondragover=event=>{event.preventDefault();let rect=choice.getBoundingClientRect(),target=choice.closest('article');target.parentElement.insertBefore(drag,event.clientY<rect.top+rect.height/2?target:target.nextSibling);refreshArrows(target.parentElement);variantChanged()}})}function selection(){let result={};qa('.choices').forEach(section=>result[section.dataset.key]=qa('.choice',section).map((choice,index)=>({id:choice.dataset.id,sichtbar:choice.querySelector('input[type=checkbox]').checked,reihenfolge:index+1})));return result}function previewRows(key){let selected=Object.fromEntries((selection()[key]||[]).filter(x=>x.sichtbar).map(x=>[x.id,x]));return(profile[key]||[]).filter(x=>selected[x.id]).sort((a,b)=>selected[a.id].reihenfolge-selected[b.id].reihenfolge)}function showPreview(){let name=q('#vn').value.trim()||'Unbenannte Variante',role=q('#vr').value.trim()||profile.person.rolle||'Rolle noch ergänzen',sections=[],kp=profile.kurzprofil||{};if(kp.positionierung||kp.zusammenfassung)sections.push(`<section class="preview-section"><h3>Kurzprofil</h3><b>${e(kp.positionierung||'')}</b><p>${e(kp.zusammenfassung||'')}</p></section>`);for(let key of ['kompetenzen','branchen','qualifikationen','sprachen']){let rows=previewRows(key);if(rows.length)sections.push(`<section class="preview-section"><h3>${labels[key]}</h3><div>${rows.map(x=>e(key==='sprachen'?x.sprache+(x.niveau?' · '+x.niveau:''):x.bezeichnung)).join(' · ')}</div></section>`)}let projects=previewRows('projekte');if(projects.length)sections.push(`<section class="preview-section"><h3>Projekterfahrung</h3>${projects.map(p=>`<div class="preview-project"><b>${e(p.titel)}</b><div class="meta">${e([month(p.startMonat),p.laufend?'laufend':month(p.endeMonat),p.rolle].filter(Boolean).join(' · '))}</div><p>${e(p.beschreibung)}</p><p><b>Tätigkeiten:</b> ${e(p.aufgaben)}</p></div>`).join('')}</section>`);q('#variant-preview').innerHTML=`<section class="preview"><div class="preview-head"><h2>Vorschau: ${e(name)}</h2><div class="muted">${e(role)} · Diese Ansicht zeigt genau die aktuell eingeschalteten Inhalte in ihrer gewählten Reihenfolge.</div></div><div class="preview-body">${sections.join('')||'<p class="muted">Für diese Variante sind noch keine Inhalte eingeschaltet.</p>'}</div></section>`}async function saveVariant(freigeben){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id,'PUT',{name:q('#vn').value.trim()||'Unbenannte Variante',zielrolle:q('#vr').value.trim(),kunde:q('#vk').value.trim(),anfrage:q('#va').value.trim(),auswahl:selection(),status:freigeben?'Freigegeben':'Entwurf'});variants(true);load();say(freigeben?'Variante gespeichert und freigegeben.':'Variante gespeichert.')}catch(error){say(error.message)}}async function removeVariant(){if(!confirm(`Variante „${variant.name}“ entfernen? Sie wird archiviert und kann bei Bedarf wiederhergestellt werden.`))return;try{await api('/profiles/'+profile.id+'/variants/'+variant.id,'DELETE');variant=null;await variants();say('Variante archiviert und aus der Liste entfernt.')}catch(error){say(error.message)}}async function finishReview(){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id+'/basis-aenderungen','POST',{});variants(true);say('Basisprofil-Änderungen geprüft.')}catch(error){say(error.message)}}function tab(id){q('.tab.active')?.classList.remove('active');q(`[data-tab="${id}"]`).classList.add('active');q('.view.active')?.classList.remove('active');q('#'+id).classList.add('active');if(id==='variants')variants();if(id==='documents')q('#documents').innerHTML='<section class="section"><h3>Dokumente</h3><div class="notice">Dateiupload und Export folgen im nächsten großen Paket.</div></section>'}qa('.tab').forEach(button=>button.onclick=()=>tab(button.dataset.tab));function dashboard(){q('#workspace').hidden=true;q('#dashboard').hidden=false;load()}function openModal(){q('#modal').classList.add('open')}function closeModal(){q('#modal').classList.remove('open')}async function createProfile(){try{let p=await api('/profiles','POST',{person:{vorname:q('#first').value.trim(),nachname:q('#last').value.trim(),rolle:q('#newrole').value.trim()}});closeModal();await load();openProfile(p.id);tab('base');say('Profilentwurf angelegt.')}catch(error){say(error.message)}}load();</script><script src="profilmanagement-enhancements.js"></script></body></html>
