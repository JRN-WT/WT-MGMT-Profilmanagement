<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WERK TRIFFT – Profilmanagement</title><style>:root{--n:#143d6a;--o:#d76f23;--c:#f9f6ef;--p:#fff;--m:#f0ebe0;--l:#c8bea8;--t:#2b2b2b;--s:#66758a;--g:#3d6e56;--r:#832233;--soft:#e8f0f8}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font:14px Arial,sans-serif}.top{height:60px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:var(--n);color:white;border-bottom:3px solid var(--o)}.brand{font-weight:800;letter-spacing:.07em}.sub{font-size:12px;color:#cfdae9}.wrap{max-width:1320px;margin:auto;padding:32px 28px 70px}h1{margin:0;font-size:30px}h2{margin:0;font-size:18px}h3,label{font:11px monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--s)}.intro,.muted,.meta{color:var(--s);line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.card,.section,.profilehead{background:var(--p);border:1px solid var(--l);border-radius:8px;overflow:hidden}.card,.section{margin-top:16px}.head,.body{padding:17px}.head,.section>h3{border-bottom:1px solid var(--l)}.section>h3{display:block;margin:0;padding:14px 17px}.section>div{padding:17px}button{font:inherit}.button,.add,.remove,.arrow{cursor:pointer;border-radius:5px}.button{border:0;padding:10px 14px;background:var(--o);color:#fff;font-weight:bold}.secondary,.add{background:var(--m)!important;color:var(--n)!important;border:1px solid var(--l)!important}.button:disabled{opacity:.5;cursor:not-allowed}.profile,.variantline{width:100%;padding:15px 18px;border:0;border-bottom:1px solid var(--l);background:#fffefa;text-align:left;cursor:pointer}.profile:hover,.variantline:hover{background:#f7f2e8}.profile{display:grid;grid-template-columns:42px 1fr 145px 24px;gap:13px;align-items:center}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e6ecf5;color:var(--n);font-weight:bold}.name{font-weight:bold}.status{display:inline-block;padding:4px 7px;background:#fff1d9;color:#956000;font:11px monospace}.Freigegeben,.Aktuell{background:#e0ece5;color:var(--g)}.Prüfung-erforderlich{background:#fff1d9}.tabs{display:flex;gap:20px;border-bottom:1px solid var(--l);margin-top:22px}.tab{border:0;background:none;padding:13px 2px;border-bottom:3px solid transparent;color:var(--s);font-weight:bold;cursor:pointer}.tab.active{color:var(--n);border-color:var(--o)}.view{display:none;padding-top:18px}.view.active{display:block}.profilehead{padding:22px;display:flex;gap:16px;align-items:center}.profilehead .avatar{width:60px;height:60px;font-size:18px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.fields,.summary{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:5px}.wide{grid-column:1/-1}input,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:4px;background:#fffefa;font:inherit}textarea{min-height:78px}.item{display:flex;gap:8px;margin:7px 0}.item input{flex:1}.remove{border:0;background:#f8e7e3;color:var(--r);padding:5px 9px}.add{margin-top:8px;padding:8px 10px;font-weight:bold}.notice{padding:13px;background:var(--soft);border-left:3px solid #6680ab;color:var(--n);line-height:1.5}.warning{background:#fff8ec;border-left-color:var(--o)}.sum{padding-bottom:8px;border-bottom:1px solid #eee8dc}.project{margin:12px 0;border:1px solid var(--l);border-left:4px solid var(--o);border-radius:5px;overflow:hidden;background:#fffefa}.projecthead{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid #e5ddcf}.ptitle{flex:1;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 2px;background:transparent;color:var(--n);font-size:16px;font-weight:700}.ptitle:focus{outline:0;border-bottom-color:var(--o)}.projectbody{padding:13px}.months{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.check{display:flex;align-items:center;gap:6px;padding:9px 0;white-space:nowrap;text-transform:none;font:inherit;color:var(--t);letter-spacing:0}.check input{width:auto}.choice{display:grid;grid-template-columns:22px 48px 1fr 30px 30px;gap:9px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--l);background:#fffefa}.choice.off{opacity:.52;background:#f4f1eb}.grip{color:var(--s);cursor:grab;font-size:18px;letter-spacing:-3px}.toggle{position:relative;width:38px;height:22px}.toggle input{opacity:0;width:0}.slider{position:absolute;inset:0;background:#aab3bb;border-radius:20px;cursor:pointer}.slider:before{content:'';position:absolute;width:16px;height:16px;top:3px;left:3px;background:#fff;border-radius:50%;transition:.2s}.toggle input:checked+.slider{background:var(--g)}.toggle input:checked+.slider:before{transform:translateX(16px)}.arrow{border:0;background:#e6ecf5;color:var(--n);width:28px;height:28px}.arrow:disabled{opacity:.25}.projectsummary{margin:0 14px 12px 78px;padding:10px 12px;background:#fff;border-left:2px solid #dbe5f1;color:var(--s);font-size:12px;line-height:1.5}.savebar{display:flex;justify-content:flex-end;gap:8px;padding-top:14px}.modal{display:none;position:fixed;inset:0;place-items:center;background:#143d6a77;padding:20px}.modal.open{display:grid}.dialog{width:min(600px,100%);padding:22px;background:#fff;border-radius:8px}.toast{position:fixed;right:22px;bottom:22px;padding:12px;background:#f1f7f3;border:1px solid var(--g);color:#1a5030;display:none}.toast.show{display:block}@media(max-width:700px){.top{padding:0 14px}.wrap{padding:22px 14px}.fields,.summary,.months{grid-template-columns:1fr}.wide{grid-column:auto}.profile{grid-template-columns:42px 1fr 24px}.hide{display:none}.projectsummary{margin-left:14px}.choice{grid-template-columns:20px 45px 1fr 27px 27px}}</style></head><body><header class="top"><div><span class="brand">WERK TRIFFT</span> – Profilmanagement</div><div class="sub" id="connection">Lokaler Arbeitsmodus</div></header><main class="wrap"><section id="dashboard"><div class="row"><div><h1>Beraterprofile</h1><p class="intro">Basisprofile pflegen und kundenbezogene Varianten zusammenstellen.</p></div><button class="button" onclick="modal(1)">+ Neues Profil</button></div><section class="card"><div class="head"><h3>Profilakten</h3><h2>Alle Profile</h2></div><div id="profiles"></div><div class="body muted" id="footer"></div></section></section><section id="workspace" hidden><div class="profilehead"><div class="avatar" id="initials">–</div><div><h1 id="fullname">–</h1><p class="intro" id="role"></p></div><div class="actions"><button class="button secondary" onclick="dashboard()">← Übersicht</button><button class="button" onclick="newVariant()">+ Neue Variante anlegen</button></div></div><nav class="tabs"><button class="tab active" data-tab="overview">Übersicht</button><button class="tab" data-tab="base">Basisprofil</button><button class="tab" data-tab="variants">Varianten</button><button class="tab" data-tab="documents">Dokumente</button></nav><div class="view active" id="overview"></div><div class="view" id="base"></div><div class="view" id="variants"></div><div class="view" id="documents"></div></section></main><div class="modal" id="modal"><div class="dialog"><div class="row"><h2>Neues Profil anlegen</h2><button class="button secondary" onclick="modal(0)">×</button></div><div class="fields"><div class="field"><label>Vorname</label><input id="first"></div><div class="field"><label>Nachname</label><input id="last"></div><div class="field wide"><label>Aktuelle Rolle</label><input id="newrole"></div></div><p style="text-align:right"><button class="button" onclick="createProfile()">Profil anlegen</button></p></div></div><div class="toast" id="toast"></div><script>const actor='Julius Rollmann',keys=['kompetenzen','branchen','qualifikationen','sprachen','projekte'],listkeys=keys.slice(0,-1),labels={kompetenzen:'Kompetenzen',branchen:'Branchen',qualifikationen:'Qualifikationen & Zertifikate',sprachen:'Sprachen',projekte:'Projekterfahrung'};let profile,variant,drag;const q=s=>document.querySelector(s),qa=(s,r=document)=>[...r.querySelectorAll(s)],e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function api(p,m='GET',d){let r=await fetch('/api'+p,{method:m,headers:{'Content-Type':'application/json','X-WT-Actor':actor},body:d&&JSON.stringify(d)}),j=await r.json();if(!r.ok)throw Error(j.fehler);return j}function say(x){q('#toast').textContent=x;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),3000)}function badge(x){return`<span class="status ${e(x).replaceAll(' ','-')}">${e(x)}</span>`}function mon(x){return x?x.slice(5)+'/'+x.slice(0,4):''}function dur(p){if(!p.startMonat)return'';if(p.laufend)return'laufend';if(!p.endeMonat)return'';let[a,b]=p.startMonat.split('-').map(Number),[c,d]=p.endeMonat.split('-').map(Number),n=(c-a)*12+d-b+1;return n>0?n+' Monate':''}async function load(){try{let a=(await api('/profiles')).profile;q('#connection').textContent='JSON-Speicherung aktiv';q('#profiles').innerHTML=a.map(x=>`<button class="profile" onclick="openProfile('${e(x.id)}')"><div class="avatar">${e(x.name.split(' ').map(y=>y[0]).join('').slice(0,2))}</div><div><div class="name">${e(x.name)}</div><div class="muted">${e(x.rolle||'Rolle noch ergänzen')}</div></div><div class="hide">${badge(x.status)}</div><div>›</div></button>`).join('')||'<div class="body muted">Noch keine Profile angelegt.</div>';q('#footer').textContent=a.length+' Profilakte'+(a.length===1?'':'n')}catch(x){say('Server nicht erreichbar.')}}async function openProfile(id){profile=await api('/profiles/'+id);variant=null;q('#dashboard').hidden=true;q('#workspace').hidden=false;render();tab('overview')}function summary(k){let a=profile[k]||[],t=a.slice(0,4).map(x=>k==='sprachen'?x.sprache+(x.niveau?' · '+x.niveau:''):k==='projekte'?x.titel:x.bezeichnung).filter(Boolean).map(e).join(' · ');return t+(a.length>4?' +'+(a.length-4):'')||'—'}function render(){q('#initials').textContent=(profile.person.vorname[0]+profile.person.nachname[0]).toUpperCase();q('#fullname').textContent=profile.person.vorname+' '+profile.person.nachname;q('#role').textContent=profile.person.rolle||'Rolle noch ergänzen';q('#overview').innerHTML=`<section class="section"><h3>Basisprofil</h3><div><p><b>${e(profile.kurzprofil.positionierung||'Positionierung noch ergänzen')}</b></p><p>${e(profile.kurzprofil.zusammenfassung||'Für dieses Basisprofil liegt noch keine Zusammenfassung vor.')}</p></div></section><section class="section"><h3>Inhalte im Basisprofil</h3><div class="summary">${keys.map(k=>`<div class="sum"><label>${labels[k]}</label><div>${summary(k)}</div></div>`).join('')}</div></section><section class="section"><h3>Prüfhinweise</h3><div class="notice">${profile.hinweise.length?profile.hinweise.map(e).join('<br>'):'Keine offenen Hinweise.'}</div></section>`;base()}function item(x,k){let a=k==='sprachen'?x.sprache:x.bezeichnung,b=k==='sprachen'?x.niveau:'';return`<div class="item" data-id="${e(x.id||'')}"><input value="${e(a||'')}" oninput="baseDirty()">${k==='sprachen'?`<input value="${e(b||'')}" oninput="baseDirty()">`:''}<button class="remove" onclick="this.parentElement.remove();baseDirty()">×</button></div>`}function list(k){return`<section class="section"><h3>${labels[k]}</h3><div><div id="l-${k}">${(profile[k]||[]).map(x=>item(x,k)).join('')}</div><button class="add" onclick="add('${k}')">+ hinzufügen</button></div></section>`}function add(k){q('#l-'+k).insertAdjacentHTML('beforeend',item({},k));baseDirty()}function project(p={}){return`<article class="project" data-id="${e(p.id||'')}"><div class="projecthead"><input class="ptitle" data-p="titel" value="${e(p.titel||'')}" oninput="baseDirty()" placeholder="Projekttitel eingeben"><button class="remove" onclick="this.closest('.project').remove();baseDirty()">Projekt entfernen</button></div><div class="projectbody"><div class="fields"><div class="months wide"><div class="field"><label>Startmonat</label><input type="month" data-p="startMonat" value="${e(p.startMonat||'')}" oninput="upd(this);baseDirty()"></div><div class="field"><label>Endmonat</label><input type="month" data-p="endeMonat" value="${e(p.endeMonat||'')}" ${p.laufend?'disabled':''} oninput="upd(this);baseDirty()"></div><label class="check"><input type="checkbox" data-p="laufend" ${p.laufend?'checked':''} onchange="run(this);baseDirty()"> laufend</label></div><div class="wide muted d">${dur(p)?'Dauer: '+dur(p):'Dauer wird aus Start und Ende berechnet.'}</div><div class="field wide"><label>Rolle</label><input data-p="rolle" value="${e(p.rolle||'')}" oninput="baseDirty()"></div><div class="field wide"><label>Kurzbeschreibung</label><textarea data-p="beschreibung" oninput="baseDirty()">${e(p.beschreibung||'')}</textarea></div><div class="field wide"><label>Tätigkeiten</label><textarea data-p="aufgaben" oninput="baseDirty()">${e(p.aufgaben||'')}</textarea></div></div></div></article>`}function readp(r){let g=k=>r.querySelector(`[data-p="${k}"]`);return{id:r.dataset.id||crypto.randomUUID(),titel:g('titel').value.trim(),startMonat:g('startMonat').value,endeMonat:g('endeMonat').value,laufend:g('laufend').checked,rolle:g('rolle').value.trim(),beschreibung:g('beschreibung').value.trim(),aufgaben:g('aufgaben').value.trim()}}function run(x){let e=x.closest('.project').querySelector('[data-p=endeMonat]');e.disabled=x.checked;if(x.checked)e.value='';upd(x)}function upd(x){let r=x.closest('.project'),p=readp(r);r.querySelector('.d').textContent=dur(p)?'Dauer: '+dur(p):'Dauer wird aus Start und Ende berechnet.'}function collect(k){return qa('#l-'+k+' .item').map(r=>{let a=qa('input',r).map(x=>x.value.trim());return k==='sprachen'?{id:r.dataset.id||crypto.randomUUID(),sprache:a[0],niveau:a[1]}:{id:r.dataset.id||crypto.randomUUID(),bezeichnung:a[0],details:''}}).filter(x=>k==='sprachen'?x.sprache:x.bezeichnung)}function baseDirty(){q('#savebase').disabled=false}function base(){q('#base').innerHTML=`<div class="row"><div><h2>Basisprofil</h2><p class="intro">Alle Änderungen – auch Projekte – speicherst du mit „Basisprofil speichern“. Vollständig leere Projektkarten werden beim Speichern nicht übernommen.</p></div><button id="savebase" class="button" onclick="savebase()">Basisprofil speichern</button></div><section class="section"><h3>Stammdaten</h3><div class="fields">${[['vorname','Vorname'],['nachname','Nachname'],['rolle','Aktuelle Rolle'],['standort','Standort'],['interneEmail','Interne E-Mail'],['telefon','Telefonnummer']].map(a=>`<div class="field"><label>${a[1]}</label><input data-person="${a[0]}" value="${e(profile.person[a[0]]||'')}" oninput="baseDirty()"></div>`).join('')}</div></section><section class="section"><h3>Kurzprofil</h3><div class="fields"><div class="field wide"><label>Positionierung</label><textarea id="pos" oninput="baseDirty()">${e(profile.kurzprofil.positionierung||'')}</textarea></div><div class="field wide"><label>Zusammenfassung</label><textarea id="sum" oninput="baseDirty()">${e(profile.kurzprofil.zusammenfassung||'')}</textarea></div></div></section>${listkeys.map(list).join('')}<section class="section"><h3>Projekterfahrung</h3><div><p class="muted">Der fett dargestellte Titel oben ist direkt editierbar.</p><div id="projects">${(profile.projekte||[]).map(project).join('')}</div><button class="add" onclick="q('#projects').insertAdjacentHTML('beforeend',project());baseDirty()">+ Projekt hinzufügen</button></div></section>`}async function savebase(){let person={};qa('[data-person]').forEach(x=>person[x.dataset.person]=x.value.trim());let ps=qa('#projects .project').map(readp).filter(p=>Object.entries(p).some(([k,v])=>k!=='id'&&v!==''&&v!==false));try{profile=await api('/profiles/'+profile.id,'PUT',{status:profile.status,person,kurzprofil:{positionierung:q('#pos').value.trim(),zusammenfassung:q('#sum').value.trim()},...Object.fromEntries(listkeys.map(k=>[k,collect(k)])),projekte:ps});render();load();say('Basisprofil gespeichert.')}catch(x){say(x.message)}}async function newVariant(){variant=await api('/profiles/'+profile.id+'/variants','POST',{name:'Neue Profilvariante',zielrolle:profile.person.rolle});tab('variants');variants(true);say('Neue Variante angelegt.')}async function openVariant(id){variant=await api('/profiles/'+profile.id+'/variants/'+id);variants(true)}function entries(k){let m=Object.fromEntries((variant.auswahl[k]||[]).map(x=>[x.id,x]));return(profile[k]||[]).map((x,i)=>({...x,sichtbar:m[x.id]?.sichtbar===true,reihenfolge:m[x.id]?.reihenfolge??i+1})).sort((a,b)=>a.reihenfolge-b.reihenfolge)}function choice(k,x,i,n){let t=k==='projekte'?x.titel:k==='sprachen'?x.sprache+' · '+(x.niveau||'Niveau nicht angegeben'):x.bezeichnung,meta=k==='projekte'?[mon(x.startMonat),x.laufend?'laufend':mon(x.endeMonat),x.rolle].filter(Boolean).join(' · '):'',more=k==='projekte'?`<div class="projectsummary"><b>Kurzbeschreibung:</b> ${e(x.beschreibung||'–')}<br><b>Tätigkeiten:</b> ${e(x.aufgaben||'–')}</div>`:'';return`<article><div class="choice ${x.sichtbar?'':'off'}" draggable data-id="${e(x.id)}"><span class="grip">⠿</span><label class="toggle"><input type="checkbox" ${x.sichtbar?'checked':''} onchange="dirty()"><span class="slider"></span></label><span><b>${e(t||'Ohne Bezeichnung')}</b>${meta?`<span class="meta">${e(meta)}</span>`:''}</span><button class="arrow" onclick="move(this,-1)" ${i?'':'disabled'}>↑</button><button class="arrow" onclick="move(this,1)" ${i===n-1?'disabled':''}>↓</button></div>${more}</article>`}function section(k){let a=entries(k);return`<section class="section"><h3>${labels[k]} · ein-/ausschalten und priorisieren</h3><div class="choices" data-k="${k}">${a.map((x,i)=>choice(k,x,i,a.length)).join('')||'<p class="muted">Noch keine Einträge vorhanden.</p>'}</div></section>`}async function variants(edit=false){let vs=(await api('/profiles/'+profile.id+'/variants')).varianten;if(!edit||!variant){q('#variants').innerHTML=`<div class="row"><div><h2>Varianten</h2><p class="intro">Jede Variante ist eine eigene gespeicherte Fassung. Für eine weitere Fassung: „+ Neue Variante anlegen“.</p></div><button class="button" onclick="newVariant()">+ Neue Variante anlegen</button></div><section class="section"><div>${vs.map(v=>`<button class="variantline" onclick="openVariant('${e(v.id)}')"><b>${e(v.name)}</b><div class="meta">${e(v.zielrolle||'Zielrolle noch ergänzen')}</div>${badge(v.pruefungErforderlich?'Prüfung erforderlich':v.status)}</button>`).join('')||'Noch keine Variante angelegt.'}</div></section>`;return}q('#variants').innerHTML=`<div class="row"><div><h2>Variante bearbeiten</h2><p class="intro">„Änderungen speichern“ sichert Name, Kontext, Schalter und Reihenfolge. „Speichern und freigeben“ sichert alles und gibt diese Variante frei.</p></div><button class="button secondary" onclick="variant=null;variants()">← Variantenliste</button></div>${variant.pruefungErforderlich?'<div class="notice warning">Basisprofil geändert: Neue Einträge sind ausgeschaltet. Bitte Auswahl prüfen.</div>':''}<section class="section"><h3>Kontext der Variante</h3><div class="fields"><div class="field"><label>Name der Variante</label><input id="vn" value="${e(variant.name)}" oninput="dirty()"></div><div class="field"><label>Zielrolle</label><input id="vr" value="${e(variant.zielrolle||'')}" oninput="dirty()"></div><div class="field"><label>Kunde</label><input id="vk" value="${e(variant.kunde||'')}" oninput="dirty()"></div><div class="field"><label>Anfrage / Projekt</label><input id="va" value="${e(variant.anfrage||'')}" oninput="dirty()"></div></div></section>${keys.map(section).join('')}<div class="savebar"><button id="savevar" class="button" onclick="savevar(0)" disabled>Änderungen speichern</button><button class="button" onclick="savevar(1)">Speichern und freigeben</button></div>`;dnd()}function dirty(){q('#savevar').disabled=false}function move(b,d){let r=b.closest('article'),s=d<0?r.previousElementSibling:r.nextElementSibling;if(s){r.parentElement.insertBefore(r,d<0?s:s.nextSibling);dirty()}}function dnd(){qa('.choice').forEach(x=>{x.ondragstart=()=>drag=x.closest('article');x.ondragover=e=>{e.preventDefault();let r=x.getBoundingClientRect(),a=x.closest('article');a.parentElement.insertBefore(drag,e.clientY<r.top+r.height/2?a:a.nextSibling);dirty()}})}function sel(){let o={};qa('.choices').forEach(c=>o[c.dataset.k]=qa('.choice',c).map((x,i)=>({id:x.dataset.id,sichtbar:x.querySelector('input').checked,reihenfolge:i+1})));return o}async function savevar(release){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id,'PUT',{name:q('#vn').value.trim()||'Unbenannte Variante',zielrolle:q('#vr').value.trim(),kunde:q('#vk').value.trim(),anfrage:q('#va').value.trim(),auswahl:sel(),status:release?'Freigegeben':'Entwurf'});variants(true);load();say(release?'Variante gespeichert und freigegeben.':'Änderungen gespeichert.')}catch(x){say(x.message)}}function tab(id){q('.tab.active')?.classList.remove('active');q(`[data-tab="${id}"]`).classList.add('active');q('.view.active')?.classList.remove('active');q('#'+id).classList.add('active');if(id==='variants')variants();if(id==='documents')q('#documents').innerHTML='<section class="section"><h3>Dokumente</h3><div class="notice">Dateiupload und Export folgen im nächsten Paket.</div></section>'}qa('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));function dashboard(){q('#workspace').hidden=true;q('#dashboard').hidden=false;load()}function modal(x){q('#modal').classList.toggle('open',!!x)}async function createProfile(){try{let p=await api('/profiles','POST',{person:{vorname:q('#first').value.trim(),nachname:q('#last').value.trim(),rolle:q('#newrole').value.trim()}});modal(0);await openProfile(p.id);tab('base');say('Profilentwurf angelegt.')}catch(x){say(x.message)}}load();</script></body></html>
