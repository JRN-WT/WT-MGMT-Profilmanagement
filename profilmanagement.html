<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WERK TRIFFT – Profilmanagement</title><style>:root{--n:#143d6a;--o:#d76f23;--c:#f9f6ef;--p:#fff;--l:#c8bea8;--t:#2b2b2b;--s:#66758a;--g:#3d6e56;--r:#832233}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font:14px Arial,sans-serif}.top{padding:18px 32px;background:var(--n);border-bottom:3px solid var(--o);color:white}.brand{font-weight:bold;letter-spacing:.08em}.wrap{max-width:1280px;margin:auto;padding:30px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{margin:0;font-size:28px}h2{font-size:18px;margin:0}h3,label{font:11px monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--s)}.muted,.intro,.meta{color:var(--s);line-height:1.45}.card,.section,.profilehead{background:var(--p);border:1px solid var(--l);border-radius:7px;overflow:hidden}.card,.section{margin-top:16px}.section>h3{padding:13px 16px;margin:0;border-bottom:1px solid var(--l)}.section>div{padding:16px}.button,.add,.remove,.arrow{font:inherit;cursor:pointer;border:0;border-radius:4px;padding:9px 12px}.button{background:var(--o);color:#fff;font-weight:bold}.secondary,.add{background:#f0ebe0!important;color:var(--n)!important;border:1px solid var(--l)!important}.button:disabled{opacity:.5;cursor:not-allowed}.profile,.variantline{width:100%;padding:14px 17px;text-align:left;background:#fffefa;border:0;border-bottom:1px solid var(--l);cursor:pointer}.profile:hover,.variantline:hover{background:#f7f2e8}.status{display:inline-block;padding:4px 7px;background:#fff1d9;color:#956000;font:11px monospace}.Freigegeben,.Aktuell{background:#e0ece5;color:var(--g)}.Prüfung-erforderlich{background:#fff1d9}.tabs{display:flex;gap:18px;border-bottom:1px solid var(--l);margin-top:20px}.tab{border:0;background:none;padding:12px 2px;font-weight:bold;color:var(--s);cursor:pointer}.tab.active{color:var(--n);border-bottom:3px solid var(--o)}.view{display:none;padding-top:16px}.view.active{display:block}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}input,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:4px;background:#fffefa;font:inherit}textarea{min-height:76px}.item{display:flex;gap:8px;margin:7px 0}.item input{flex:1}.remove{background:#f8e7e3;color:var(--r)}.project{border:1px solid var(--l);border-left:4px solid var(--o);margin:10px 0;background:#fffefa}.project-head{padding:10px 13px;display:flex;justify-content:space-between;border-bottom:1px solid var(--l);font-weight:bold;color:var(--n)}.project-body{padding:13px}.months{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.check{display:flex;gap:6px;align-items:center;padding:8px 0;text-transform:none;font:inherit;color:var(--t);letter-spacing:0}.check input{width:auto}.notice{padding:12px;border-left:3px solid var(--o);background:#fff8ec;color:var(--n)}.choice{display:grid;grid-template-columns:22px 48px 1fr 30px 30px;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--l);background:#fffefa}.choice.off{opacity:.5}.grip{cursor:grab;color:var(--s);font-size:18px;letter-spacing:-3px}.toggle{position:relative;width:38px;height:22px}.toggle input{opacity:0;width:0}.slider{position:absolute;inset:0;border-radius:20px;background:#aab3bb;cursor:pointer}.slider:before{content:'';position:absolute;width:16px;height:16px;top:3px;left:3px;background:white;border-radius:50%;transition:.2s}.toggle input:checked+.slider{background:var(--g)}.toggle input:checked+.slider:before{transform:translateX(16px)}.arrow{padding:5px;background:#e6ecf5;color:var(--n)}.arrow:disabled{opacity:.3}.projectsummary{padding:0 15px 12px;margin-left:70px;font-size:12px;color:var(--s);line-height:1.5}.toast{position:fixed;bottom:20px;right:20px;background:#f1f7f3;border:1px solid var(--g);color:#1a5030;padding:12px;display:none}.toast.show{display:block}@media(max-width:700px){.wrap{padding:20px 12px}.fields,.months{grid-template-columns:1fr}.wide{grid-column:auto}.projectsummary{margin-left:0}.choice{grid-template-columns:20px 45px 1fr 27px 27px}}</style></head><body><header class="top"><span class="brand">WERK TRIFFT</span> – Profilmanagement</header><main class="wrap"><section id="dashboard"><div class="row"><div><h1>Beraterprofile</h1><p class="intro">Basisprofile pflegen und kundenbezogene Varianten zusammenstellen.</p></div><button class="button" onclick="createProfile()">+ Neues Profil</button></div><section class="card"><div id="profiles"></div></section></section><section id="workspace" hidden><div class="profilehead" style="padding:20px"><div><h1 id="name"></h1><p class="intro" id="role"></p></div><div><button class="button secondary" onclick="dashboard()">← Übersicht</button><button class="button" onclick="newVariant()">+ Variante</button></div></div><nav class="tabs"><button class="tab active" data-tab="overview">Übersicht</button><button class="tab" data-tab="base">Basisprofil</button><button class="tab" data-tab="variants">Varianten</button></nav><div class="view active" id="overview"></div><div class="view" id="base"></div><div class="view" id="variants"></div></section></main><div class="toast" id="toast"></div><script>const actor='Julius Rollmann',keys=['kompetenzen','branchen','qualifikationen','sprachen'],labels={kompetenzen:'Kompetenzen',branchen:'Branchen',qualifikationen:'Qualifikationen & Zertifikate',sprachen:'Sprachen'};let profile,variant,drag;const q=s=>document.querySelector(s),qa=(s,x=document)=>[...x.querySelectorAll(s)],e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-WT-Actor':actor},body:data&&JSON.stringify(data)}),j=await r.json();if(!r.ok)throw Error(j.fehler);return j}function say(s){q('#toast').textContent=s;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),3000)}function badge(s){return`<span class="status ${e(s).replaceAll(' ','-')}">${e(s)}</span>`}function dur(p){if(!p.startMonat)return'';if(p.laufend)return'laufend';if(!p.endeMonat)return'';let[a,b]=p.startMonat.split('-').map(Number),[c,d]=p.endeMonat.split('-').map(Number),n=(c-a)*12+d-b+1;return n>0?n+' Monate':''}async function load(){try{let a=(await api('/profiles')).profile;q('#profiles').innerHTML=a.map(p=>`<button class="profile" onclick="openProfile('${e(p.id)}')"><b>${e(p.name)}</b><div class="meta">${e(p.rolle||'Rolle noch ergänzen')} · ${badge(p.status)}</div></button>`).join('')||'<p class="muted" style="padding:16px">Noch keine Profile angelegt.</p>'}catch(x){say('Server nicht erreichbar.')}}async function createProfile(){let first=prompt('Vorname'),last=prompt('Nachname');if(!first||!last)return;try{let p=await api('/profiles','POST',{person:{vorname:first,nachname:last,rolle:''}});await openProfile(p.id)}catch(x){say(x.message)}}async function openProfile(id){profile=await api('/profiles/'+id);variant=null;q('#dashboard').hidden=true;q('#workspace').hidden=false;render();tab('overview')}function render(){q('#name').textContent=profile.person.vorname+' '+profile.person.nachname;q('#role').textContent=profile.person.rolle||'Rolle noch ergänzen';q('#overview').innerHTML=`<section class="section"><h3>Basisprofil</h3><div><b>${e(profile.kurzprofil.positionierung||'Positionierung noch ergänzen')}</b><p>${e(profile.kurzprofil.zusammenfassung||'Zusammenfassung noch ergänzen.')}</p></div></section>`;base()}function item(x,k){let a=k==='sprachen'?x.sprache:x.bezeichnung,b=k==='sprachen'?x.niveau:'';return`<div class="item" data-id="${e(x.id||'')}"><input value="${e(a||'')}" oninput="dirtyBase()">${k==='sprachen'?`<input value="${e(b||'')}" oninput="dirtyBase()">`:''}<button class="remove" onclick="this.parentElement.remove();dirtyBase()">×</button></div>`}function list(k){return`<section class="section"><h3>${labels[k]}</h3><div><div id="l-${k}">${(profile[k]||[]).map(x=>item(x,k)).join('')}</div><button class="add" onclick="add('${k}')">+ hinzufügen</button></div></section>`}function add(k){q('#l-'+k).insertAdjacentHTML('beforeend',item({},k));dirtyBase()}function project(p={}){return`<article class="project" data-id="${e(p.id||'')}"><div class="project-head">Projekt<button class="remove" onclick="this.closest('.project').remove();dirtyBase()">Projekt entfernen</button></div><div class="project-body"><div class="fields"><div class="field wide"><label>Titel</label><input data-p="titel" value="${e(p.titel||'')}" oninput="dirtyBase()"></div><div class="months wide"><div class="field"><label>Startmonat</label><input type="month" data-p="startMonat" value="${e(p.startMonat||'')}" oninput="upd(this);dirtyBase()"></div><div class="field"><label>Endmonat</label><input type="month" data-p="endeMonat" value="${e(p.endeMonat||'')}" ${p.laufend?'disabled':''} oninput="upd(this);dirtyBase()"></div><label class="check"><input type="checkbox" data-p="laufend" ${p.laufend?'checked':''} onchange="run(this);dirtyBase()"> laufend</label></div><div class="wide muted d">${dur(p)?'Dauer: '+dur(p):'Dauer wird aus Start und Ende berechnet.'}</div><div class="field wide"><label>Rolle</label><input data-p="rolle" value="${e(p.rolle||'')}" oninput="dirtyBase()"></div><div class="field wide"><label>Kurzbeschreibung</label><textarea data-p="beschreibung" oninput="dirtyBase()">${e(p.beschreibung||'')}</textarea></div><div class="field wide"><label>Tätigkeiten</label><textarea data-p="aufgaben" oninput="dirtyBase()">${e(p.aufgaben||'')}</textarea></div></div></div></article>`}function readp(r){let g=k=>r.querySelector(`[data-p="${k}"]`);return{id:r.dataset.id||crypto.randomUUID(),titel:g('titel').value.trim(),startMonat:g('startMonat').value,endeMonat:g('endeMonat').value,laufend:g('laufend').checked,rolle:g('rolle').value.trim(),beschreibung:g('beschreibung').value.trim(),aufgaben:g('aufgaben').value.trim()}}function run(x){let e=x.closest('.project').querySelector('[data-p=endeMonat]');e.disabled=x.checked;if(x.checked)e.value='';upd(x)}function upd(x){let r=x.closest('.project'),p=readp(r);r.querySelector('.d').textContent=dur(p)?'Dauer: '+dur(p):'Dauer wird aus Start und Ende berechnet.'}function collect(k){return qa('#l-'+k+' .item').map(r=>{let a=qa('input',r).map(x=>x.value.trim());return k==='sprachen'?{id:r.dataset.id||crypto.randomUUID(),sprache:a[0],niveau:a[1]}:{id:r.dataset.id||crypto.randomUUID(),bezeichnung:a[0],details:''}}).filter(x=>k==='sprachen'?x.sprache:x.bezeichnung)}function dirtyBase(){q('#savebase').disabled=false}function base(){q('#base').innerHTML=`<div class="row"><div><h2>Basisprofil</h2><p class="intro">Hier werden alle Informationen gepflegt. Varianten übernehmen sie automatisch.</p></div><button id="savebase" class="button" onclick="savebase()">Basisprofil speichern</button></div><section class="section"><h3>Stammdaten</h3><div class="fields">${[['vorname','Vorname'],['nachname','Nachname'],['rolle','Aktuelle Rolle']].map(a=>`<div class="field"><label>${a[1]}</label><input data-person="${a[0]}" value="${e(profile.person[a[0]]||'')}" oninput="dirtyBase()"></div>`).join('')}</div></section><section class="section"><h3>Kurzprofil</h3><div class="fields"><div class="field wide"><label>Positionierung</label><textarea id="pos" oninput="dirtyBase()">${e(profile.kurzprofil.positionierung||'')}</textarea></div><div class="field wide"><label>Zusammenfassung</label><textarea id="sum" oninput="dirtyBase()">${e(profile.kurzprofil.zusammenfassung||'')}</textarea></div></div></section>${keys.map(list).join('')}<section class="section"><h3>Projekterfahrung</h3><div><p class="muted">Titel, Zeitraum, Rolle, Kurzbeschreibung und Tätigkeiten bilden ein Projekt.</p><div id="projects">${(profile.projekte||[]).map(project).join('')}</div><button class="add" onclick="q('#projects').insertAdjacentHTML('beforeend',project());dirtyBase()">+ Projekt hinzufügen</button></div></section>`}async function savebase(){let person={};qa('[data-person]').forEach(x=>person[x.dataset.person]=x.value.trim());try{profile=await api('/profiles/'+profile.id,'PUT',{status:profile.status,person,kurzprofil:{positionierung:q('#pos').value.trim(),zusammenfassung:q('#sum').value.trim()},...Object.fromEntries(keys.map(k=>[k,collect(k)])),projekte:qa('#projects .project').map(readp)});render();load();say('Basisprofil gespeichert. Betroffene Varianten sind zur Prüfung markiert.')}catch(x){say(x.message)}}async function newVariant(){variant=await api('/profiles/'+profile.id+'/variants','POST',{name:'Neue Profilvariante',zielrolle:profile.person.rolle});tab('variants');variants(true)}async function openVariant(id){variant=await api('/profiles/'+profile.id+'/variants/'+id);variants(true)}function entries(k){let m=Object.fromEntries((variant.auswahl[k]||[]).map(x=>[x.id,x]));return(profile[k]||[]).map((x,i)=>({...x,sichtbar:m[x.id]?.sichtbar===true,reihenfolge:m[x.id]?.reihenfolge??i+1})).sort((a,b)=>a.reihenfolge-b.reihenfolge)}function choice(k,x,i,n){let t=k==='projekte'?x.titel:k==='sprachen'?x.sprache+' · '+(x.niveau||'Niveau nicht angegeben'):x.bezeichnung,extra=k==='projekte'?`<div class="projectsummary"><b>Kurzbeschreibung:</b> ${e(x.beschreibung||'–')}<br><b>Tätigkeiten:</b> ${e(x.aufgaben||'–')}</div>`:'';return`<article><div class="choice ${x.sichtbar?'':'off'}" draggable data-id="${e(x.id)}"><span class="grip">⠿</span><label class="toggle"><input type="checkbox" ${x.sichtbar?'checked':''} onchange="toggle(this)"><span class="slider"></span></label><span><b>${e(t||'Ohne Bezeichnung')}</b>${k==='projekte'?`<span class="meta">${e([x.startMonat,x.laufend?'laufend':x.endeMonat,x.rolle].filter(Boolean).join(' · '))}</span>`:''}</span><button class="arrow" onclick="move(this,-1)" ${i?'':'disabled'}>↑</button><button class="arrow" onclick="move(this,1)" ${i===n-1?'disabled':''}>↓</button></div>${extra}</article>`}function section(k,title){let a=entries(k);return`<section class="section"><h3>${title} · ein-/ausschalten und priorisieren</h3><div class="choices" data-k="${k}">${a.map((x,i)=>choice(k,x,i,a.length)).join('')||'<p class="muted">Noch keine Einträge vorhanden.</p>'}</div></section>`}async function variants(edit=false){let vs=(await api('/profiles/'+profile.id+'/variants')).varianten;if(!edit||!variant){q('#variants').innerHTML=`<div class="row"><div><h2>Varianten</h2><p class="intro">Sichtbarkeit und Reihenfolge steuern – Inhalte bleiben im Basisprofil.</p></div><button class="button" onclick="newVariant()">+ Variante</button></div><section class="section"><div>${vs.map(v=>`<button class="variantline" onclick="openVariant('${e(v.id)}')"><b>${e(v.name)}</b><div class="meta">${e(v.zielrolle||'Zielrolle noch ergänzen')}</div>${badge(v.pruefungErforderlich?'Prüfung erforderlich':v.status)}</button>`).join('')||'Noch keine Variante angelegt.'}</div></section>`;return}q('#variants').innerHTML=`<div class="row"><div><h2>Variante bearbeiten</h2><p class="intro">Der Schalter entscheidet, was in der Variante erscheint.</p></div><div><button class="button secondary" onclick="variant=null;variants()">← Varianten</button>${variant.pruefungErforderlich?'<button class="button" onclick="review()">Prüfung abschließen</button>':''}</div></div>${variant.pruefungErforderlich?'<div class="notice">Das Basisprofil wurde geändert. Neue Einträge sind ausgeschaltet. Prüfe Auswahl und Reihenfolge und schließe danach die Prüfung ab.</div>':''}<section class="section"><h3>Kontext</h3><div class="fields"><div class="field"><label>Name</label><input id="vn" value="${e(variant.name)}" oninput="dirty()"></div><div class="field"><label>Zielrolle</label><input id="vr" value="${e(variant.zielrolle||'')}" oninput="dirty()"></div><div class="field"><label>Kunde</label><input id="vk" value="${e(variant.kunde||'')}" oninput="dirty()"></div><div class="field"><label>Anfrage / Projekt</label><input id="va" value="${e(variant.anfrage||'')}" oninput="dirty()"></div></div></section>${keys.map(k=>section(k,labels[k])).join('')}${section('projekte','Projekterfahrung')}<p style="text-align:right"><button id="savevar" class="button" onclick="savevar()" disabled>Änderungen speichern</button><button class="button secondary" onclick="release()">Freigeben</button></p>`;dnd()}function dirty(){q('#savevar').disabled=false}function toggle(x){x.closest('.choice').classList.toggle('off',!x.checked);dirty()}function move(b,d){let r=b.closest('article'),s=d<0?r.previousElementSibling:r.nextElementSibling;if(s){r.parentElement.insertBefore(r,d<0?s:s.nextSibling);dirty()}}function dnd(){qa('.choice').forEach(x=>{x.ondragstart=()=>drag=x.closest('article');x.ondragover=e=>{e.preventDefault();let r=x.getBoundingClientRect(),a=x.closest('article');a.parentElement.insertBefore(drag,e.clientY<r.top+r.height/2?a:a.nextSibling);dirty()}})}function sel(){let o={};qa('.choices').forEach(c=>o[c.dataset.k]=qa('.choice',c).map((x,i)=>({id:x.dataset.id,sichtbar:x.querySelector('input').checked,reihenfolge:i+1})));return o}async function put(status){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id,'PUT',{name:q('#vn').value||'Unbenannte Variante',zielrolle:q('#vr').value,kunde:q('#vk').value,anfrage:q('#va').value,auswahl:sel(),status});variants(true);load();say(status==='Freigegeben'?'Variante freigegeben.':'Änderungen gespeichert.')}catch(x){say(x.message)}}function savevar(){put('Entwurf')}function release(){put('Freigegeben')}async function review(){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id+'/basis-aenderungen','POST',{});variants(true);say('Basisprofil-Änderungen geprüft.')}catch(x){say(x.message)}}function tab(id){q('.tab.active').classList.remove('active');q(`[data-tab="${id}"]`).classList.add('active');q('.view.active').classList.remove('active');q('#'+id).classList.add('active');if(id==='variants')variants()}qa('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));function dashboard(){q('#workspace').hidden=true;q('#dashboard').hidden=false;load()}load();</script></body></html>
