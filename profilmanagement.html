<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WERK TRIFFT – Profilmanagement</title><style>
:root{--n:#143d6a;--o:#d76f23;--c:#f9f6ef;--p:#fff;--m:#f0ebe0;--l:#c8bea8;--t:#2b2b2b;--s:#66758a;--g:#3d6e56;--r:#832233}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font:14px Arial,sans-serif}.top{height:60px;background:var(--n);color:#fff;border-bottom:3px solid var(--o);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font-weight:800;letter-spacing:.07em}.sub,.muted{color:var(--s)}.top .sub{color:#cfdae9;font-size:12px}.wrap{max-width:1320px;margin:auto;padding:34px 28px 70px}h1{font-size:30px;margin:0}h2{font-size:18px;margin:0}h3{font:11px monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--s);margin:0}.intro{color:var(--s);line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.card,.section,.profilehead{background:var(--p);border:1px solid var(--l);border-radius:8px;overflow:hidden}.card{margin-top:26px}.head,.body{padding:18px}.head{border-bottom:1px solid var(--l)}.button{border:0;border-radius:5px;padding:10px 14px;background:var(--o);color:#fff;font-weight:bold;cursor:pointer}.button.secondary,.add,.move{background:var(--m);color:var(--n);border:1px solid var(--l)}.button:hover{filter:brightness(.95)}.profile{width:100%;border:0;border-bottom:1px solid var(--l);background:#fffefa;text-align:left;padding:16px 18px;display:grid;grid-template-columns:42px 1fr 150px 24px;gap:13px;align-items:center;cursor:pointer}.profile:hover,.variantline:hover{background:#f7f2e8}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e6ecf5;color:var(--n);font-weight:bold}.name{font-weight:bold}.status{font:11px monospace;padding:4px 7px;width:max-content;background:#fef0e0;color:#9a6800}.Aktuell,.Freigegeben{background:#e0ece5;color:var(--g)}.Basisprofil-aktualisiert{background:#e8f0f8;color:var(--n)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--l);margin-top:22px}.tab{border:0;background:transparent;padding:13px 2px;border-bottom:3px solid transparent;font-weight:bold;color:var(--s);cursor:pointer}.tab.active{border-color:var(--o);color:var(--n)}.view{display:none;padding-top:22px}.view.active{display:block}.profilehead{padding:22px;display:flex;gap:16px;align-items:center}.profilehead .avatar{width:60px;height:60px;font-size:18px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.section{margin-bottom:16px}.section>h3{padding:14px 17px;border-bottom:1px solid var(--l)}.section>div{padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}.field label{font:10px monospace;text-transform:uppercase;color:var(--s)}input,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:4px;background:#fffefa;font:inherit}textarea{min-height:80px}.item{display:grid;grid-template-columns:1fr 1fr auto auto;gap:7px;margin:7px 0;padding:7px;background:#fffefa;border:1px solid #e5ddcc;align-items:start}.item.language{grid-template-columns:1fr 1fr auto auto}.item .visible{font-size:11px;color:var(--s);white-space:nowrap;padding:8px 1px}.remove,.move{border:0;padding:6px 9px;cursor:pointer}.remove{background:#f8e7e3;color:var(--r)}.add{margin-top:8px;padding:8px 10px;border-radius:4px;font-weight:bold;cursor:pointer}.notice{background:#e8f0f8;border-left:3px solid #6680ab;padding:13px;color:var(--n);line-height:1.5}.warning{background:#fff8ec;border-left-color:var(--o)}.variantline{padding:16px 18px;border-bottom:1px solid var(--l);cursor:pointer}.meta{font-size:12px;color:var(--s);margin-top:5px}.action-note{margin:0 0 14px;padding:11px 13px;background:#fff8ec;border-left:3px solid var(--o);font-size:12px;line-height:1.55;color:#624a13}.modal{display:none;position:fixed;inset:0;background:#143d6a77;place-items:center;padding:20px;z-index:2}.modal.open{display:grid}.dialog{width:min(760px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:8px;padding:22px}.change{padding:12px;margin:9px 0;background:#fffefa;border:1px solid var(--l)}.change small{color:var(--s);display:block;margin-top:4px}.decision{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}.toast{position:fixed;right:22px;bottom:22px;background:#f1f7f3;border:1px solid var(--g);color:#1a5030;padding:12px;opacity:0;transform:translateY(80px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.wrap{padding:24px 14px}.top{padding:0 14px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.profile{grid-template-columns:42px 1fr 24px}.profile .hide{display:none}.profilehead{align-items:flex-start}.actions{margin:10px 0 0}.item,.item.language{grid-template-columns:1fr auto}.item input:nth-child(2){grid-column:1/-1}.tabs{gap:13px;overflow:auto}}
</style></head><body><header class="top"><div><span class="brand">WERK TRIFFT</span> – Profilmanagement</div><div class="sub" id="connection">Lokaler Arbeitsmodus</div></header><main class="wrap"><section id="dashboard"><div class="row"><div><h1>Beraterprofile</h1><p class="intro">Interne Profilakten pflegen und kundenbezogene Varianten zusammenstellen.</p></div><button class="button" onclick="modal('new')">+ Neues Profil</button></div><section class="card"><div class="head"><h3>Profilakten</h3><h2>Alle Profile</h2></div><div id="profiles"></div><div class="body muted" id="footer"></div></section></section><section id="workspace" hidden><div class="profilehead"><div class="avatar" id="initials">–</div><div><div class="row" style="justify-content:start"><h1 id="fullname">–</h1><span class="status" id="pstatus">–</span></div><p class="intro" id="role"></p></div><div class="actions"><button class="button secondary" onclick="dashboard()">← Übersicht</button><button class="button" onclick="newVariant()">+ Variante</button></div></div><nav class="tabs"><button class="tab active" data-tab="overview">Übersicht</button><button class="tab" data-tab="contents">Profilinhalte</button><button class="tab" data-tab="variants">Varianten</button><button class="tab" data-tab="documents">Dokumente</button></nav><div class="view active" id="overview"></div><div class="view" id="contents"></div><div class="view" id="variants"></div><div class="view" id="documents"></div></section></main><div class="modal" id="modal"><div class="dialog" id="dialog"></div></div><div class="toast" id="toast"></div><script>
const actor='Julius Rollmann',keys=['kompetenzen','branchen','qualifikationen','sprachen','projekte'];let profile=null,variant=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),id=()=>crypto.randomUUID();const labels={kompetenzen:'Kompetenzen',branchen:'Branchen',qualifikationen:'Qualifikationen & Zertifikate',sprachen:'Sprachen',projekte:'Projekterfahrung'};
async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-WT-Actor':actor},body:data?JSON.stringify(data):undefined}),j=await r.json();if(!r.ok)throw Error(j.fehler);return j}function say(s){q('#toast').textContent=s;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),3000)}function badge(s){return `<span class="status ${e(s).replaceAll(' ','-')}">${e(s)}</span>`}
async function load(){try{let a=(await api('/profiles')).profile;q('#connection').textContent='JSON-Speicherung aktiv';q('#profiles').innerHTML=a.map(x=>`<button class="profile" onclick="openProfile('${e(x.id)}')"><div class="avatar">${e(x.name.split(' ').map(y=>y[0]).join('').slice(0,2))}</div><div><div class="name">${e(x.name)}</div><div class="muted">${e(x.rolle||'Rolle noch ergänzen')}</div></div><div class="hide">${badge(x.status)}</div><div>›</div></button>`).join('')||'<div class="body muted">Noch keine Profile angelegt.</div>';q('#footer').textContent=a.length+' Profilakte'+(a.length===1?'':'n')}catch(x){q('#connection').textContent='Server nicht erreichbar';say('Server nicht erreichbar. Bitte profilmanagement-server.py starten.')}}
async function openProfile(pid){profile=await api('/profiles/'+pid);variant=null;q('#dashboard').hidden=true;q('#workspace').hidden=false;render();tab('overview')}function render(){let p=profile;q('#initials').textContent=(p.person.vorname[0]+p.person.nachname[0]).toUpperCase();q('#fullname').textContent=p.person.vorname+' '+p.person.nachname;q('#role').textContent=p.person.rolle||'Rolle noch ergänzen';q('#pstatus').className='status '+p.status.replaceAll(' ','-');q('#pstatus').textContent=p.status;q('#overview').innerHTML=`<section class="section"><h3>Profilkern · Revision ${p.revision||1}</h3><div><p><b>${e(p.kurzprofil.positionierung||'Positionierung noch ergänzen')}</b></p><p>${e(p.kurzprofil.zusammenfassung||'Für dieses Profil liegt noch keine Zusammenfassung vor.')}</p></div></section><section class="section"><h3>Prüfhinweise</h3><div class="notice">${p.hinweise.length?p.hinweise.map(e).join('<br>'):'Keine offenen Hinweise.'}</div></section>`;renderContents()}
function item(x,k,variantMode=false){let language=k==='sprachen',a=language?x.sprache:(x.bezeichnung||x.titel||''),b=language?x.niveau:(x.details||x.beschreibung||'');return `<div class="item ${language?'language':''}" data-id="${e(x.id||id())}"><input data-main onkeydown="enter(event,'${k}',${variantMode})" placeholder="${language?'Sprache':'Bezeichnung'}" value="${e(a)}"><input data-detail onkeydown="enter(event,'${k}',${variantMode})" placeholder="${language?'Niveau, z. B. C1':'Details / Beschreibung'}" value="${e(b)}">${variantMode?`<label class="visible"><input data-visible type="checkbox" ${x.sichtbar!==false?'checked':''}> sichtbar</label>`:''}<button class="move" title="Nach oben" onclick="move(this)">↑</button><button class="remove" title="Entfernen" onclick="this.parentElement.remove()">×</button></div>`}function add(k,vm){q('#'+k).insertAdjacentHTML('beforeend',item({},k,vm));q('#'+k).lastElementChild.querySelector('[data-main]').focus()}function enter(ev,k,vm){if(ev.key!=='Enter')return;ev.preventDefault();let r=ev.target.closest('.item'),f=qa('input',r);if(k==='sprachen'&&ev.target===f[0]&&f[0].value.trim()){f[1].focus();return}if(ev.target.value.trim())add(k,vm)}function move(b){let r=b.closest('.item'),p=r.previousElementSibling;if(p)r.parentElement.insertBefore(r,p)}function list(k,items,vm=false){return `<section class="section"><h3>${labels[k]}${vm?' · kundenbezogene Fassung':''}</h3><div><div id="${k}">${(items||[]).map(x=>item(x,k,vm)).join('')}</div><button class="add" onclick="add('${k}',${vm})">+ hinzufügen</button>${k==='sprachen'?'<p class="muted" style="font-size:12px;margin:8px 0 0">Sprache und Niveau getrennt erfassen, z. B. „Englisch“ und „C1“.</p>':'<p class="muted" style="font-size:12px;margin:8px 0 0">Enter legt den nächsten Eintrag an.</p>'}</div></section>`}function collect(k,vm=false){return qa('#'+k+' .item').map((r,i)=>{let a=r.querySelector('[data-main]').value.trim(),b=r.querySelector('[data-detail]').value.trim(),x=k==='sprachen'?{id:r.dataset.id,sprache:a,niveau:b}:{id:r.dataset.id,bezeichnung:a,details:b};if(vm){x.sichtbar=r.querySelector('[data-visible]').checked;x.reihenfolge=i+1}return x}).filter(x=>k==='sprachen'?x.sprache:x.bezeichnung)}
function renderContents(){let p=profile;q('#contents').innerHTML=`<div class="row"><div><h2>Profilinhalte</h2><p class="intro">Änderungen am Basisprofil markieren vorhandene Varianten zur Prüfung.</p></div><button class="button" onclick="saveProfile()">Änderungen speichern</button></div><section class="section"><h3>Stammdaten</h3><div class="fields">${[['vorname','Vorname'],['nachname','Nachname'],['rolle','Aktuelle Rolle'],['standort','Standort'],['interneEmail','Interne E-Mail'],['telefon','Telefonnummer']].map(x=>`<div class="field"><label>${x[1]}</label><input data-person="${x[0]}" value="${e(p.person[x[0]]||'')}"></div>`).join('')}</div></section><section class="section"><h3>Kurzprofil</h3><div class="fields"><div class="field wide"><label>Positionierung</label><textarea id="pos">${e(p.kurzprofil.positionierung||'')}</textarea></div><div class="field wide"><label>Zusammenfassung</label><textarea id="sum">${e(p.kurzprofil.zusammenfassung||'')}</textarea></div></div></section>${keys.map(k=>list(k,p[k])).join('')}`}
async function saveProfile(){let person={};qa('[data-person]').forEach(x=>person[x.dataset.person]=x.value.trim());try{profile=await api('/profiles/'+profile.id,'PUT',{status:profile.status,person,kurzprofil:{positionierung:q('#pos').value.trim(),zusammenfassung:q('#sum').value.trim()},...Object.fromEntries(keys.map(k=>[k,collect(k)]))});render();load();say('Basisprofil gespeichert. Varianten sind zur Prüfung markiert.')}catch(x){say(x.message)}}
async function newVariant(){variant=await api('/profiles/'+profile.id+'/variants','POST',{name:'Neue Profilvariante',zielrolle:profile.person.rolle});tab('variants');variants(true)}async function openVariant(vid){variant=await api('/profiles/'+profile.id+'/variants/'+vid);variants(true)}function selected(k){let a=variant.inhalte?.[k]||[],s=Object.fromEntries((variant.auswahl?.[k]||[]).map(x=>[x.id,x]));return a.map((x,i)=>({...x,sichtbar:s[x.id]?.sichtbar!==false,reihenfolge:s[x.id]?.reihenfolge??i+1})).sort((a,b)=>a.reihenfolge-b.reihenfolge)}
async function variants(edit=false){let vs=(await api('/profiles/'+profile.id+'/variants')).varianten;if(!edit||!variant){q('#variants').innerHTML=`<div class="row"><div><h2>Varianten</h2><p class="intro">Eine Variante startet mit allen Profilinhalten und ist anschließend eine eigene Kundenfassung.</p></div><button class="button" onclick="newVariant()">+ Variante</button></div><section class="section">${vs.map(x=>`<div class="variantline" onclick="openVariant('${e(x.id)}')"><b>${e(x.name)}</b><div class="meta">${e(x.zielrolle||'Zielrolle noch ergänzen')} · geprüft gegen Revision ${x.basisRevisionGeprueft||1}</div><div style="margin-top:7px">${badge(x.status)}</div></div>`).join('')||'<div class="body muted">Noch keine Variante angelegt.</div>'}</section>`;return}let c=variant.inhalte||{};q('#variants').innerHTML=`<div class="row"><div><h2>Variante bearbeiten</h2><p class="intro">Alle Inhalte sind kopiert. Hier darfst du sie für die Kundensicht ausblenden, umformulieren, ergänzen und priorisieren.</p></div><div><button class="button secondary" onclick="variant=null;variants()">← Varianten</button>${variant.pruefungErforderlich?'<button class="button" onclick="review()">Basisänderungen prüfen</button>':''}</div></div>${variant.pruefungErforderlich?'<div class="notice warning">Das Basisprofil wurde geändert. Bitte die Basisänderungen prüfen, bevor du diese Variante freigibst.</div>':''}<p class="action-note"><b>Entwurf speichern:</b> sichert deine Kundenfassung für die weitere Bearbeitung. <b>Freigeben:</b> kennzeichnet die geprüfte Fassung als extern verwendbar.</p><section class="section"><h3>Kontext der Variante</h3><div class="fields"><div class="field"><label>Name</label><input id="vn" value="${e(variant.name)}"></div><div class="field"><label>Zielrolle</label><input id="vr" value="${e(variant.zielrolle||'')}"></div><div class="field"><label>Kunde</label><input id="vk" value="${e(variant.kunde||'')}"></div><div class="field"><label>Anfrage / Projekt</label><input id="va" value="${e(variant.anfrage||'')}"></div></div></section><section class="section"><h3>Kurzprofil · kundenbezogene Fassung</h3><div class="fields"><div class="field wide"><label>Positionierung</label><textarea id="vpos">${e(c.kurzprofil?.positionierung||'')}</textarea></div><div class="field wide"><label>Zusammenfassung</label><textarea id="vsum">${e(c.kurzprofil?.zusammenfassung||'')}</textarea></div></div></section>${keys.map(k=>list(k,selected(k),true)).join('')}<p style="text-align:right"><button class="button secondary" onclick="saveVariant('Entwurf')">Entwurf speichern</button> <button class="button" onclick="saveVariant('Freigegeben')">Freigeben</button></p>`}
function vdata(){let inhalte={kurzprofil:{positionierung:q('#vpos').value.trim(),zusammenfassung:q('#vsum').value.trim()}},auswahl={};keys.forEach(k=>{let a=collect(k,true);inhalte[k]=a.map(({sichtbar,reihenfolge,...x})=>x);auswahl[k]=a.map(({id,sichtbar,reihenfolge})=>({id,sichtbar,reihenfolge}))});return {name:q('#vn').value.trim()||'Unbenannte Variante',zielrolle:q('#vr').value.trim(),kunde:q('#vk').value.trim(),anfrage:q('#va').value.trim(),inhalte,auswahl}}async function saveVariant(status){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id,'PUT',{...vdata(),status});variants(true);load();say(status==='Freigegeben'?'Variante freigegeben.':'Variantenentwurf gespeichert.')}catch(x){say(x.message)}}
async function review(){let r=await api('/profiles/'+profile.id+'/variants/'+variant.id+'/basis-aenderungen');modal('review',r)}function modal(type,data){let d=q('#dialog');if(type==='new'){d.innerHTML=`<div class="row"><h2>Neues Profil anlegen</h2><button class="button secondary" onclick="closeModal()">×</button></div><p class="intro">Startet als Entwurf. Fehlende Felder können später ergänzt werden.</p><div class="fields"><div class="field"><label>Vorname</label><input id="first"></div><div class="field"><label>Nachname</label><input id="last"></div><div class="field wide"><label>Aktuelle Rolle</label><input id="newrole"></div></div><p style="text-align:right"><button class="button" onclick="create()">Profil anlegen</button></p>`}else{let a=data.aenderungen||[];d.innerHTML=`<div class="row"><div><h2>Basisänderungen prüfen</h2><p class="intro">Basisprofil: Revision ${data.basisRevision}; zuletzt geprüft: Revision ${data.gepruefteBasisRevision}.</p></div><button class="button secondary" onclick="closeModal()">×</button></div>${a.length?a.map((x,i)=>`<div class="change" data-field="${x.feld}" data-id="${x.id}"><b>${e({neu:'Neu im Basisprofil',geaendert:'Im Basisprofil geändert',entfernt:'Im Basisprofil entfernt'}[x.typ])}: ${e(x.titel)}</b><small>„Übernehmen“ verändert die Kundenfassung. „Beibehalten“ lässt sie unverändert.</small><div class="decision"><label><input type="radio" name="d${i}" value="uebernehmen" ${x.typ==='neu'?'checked':''}> In Variante übernehmen</label><label><input type="radio" name="d${i}" value="beibehalten" ${x.typ!=='neu'?'checked':''}> Eigene Variantenfassung beibehalten</label></div></div>`).join(''):'<div class="notice">Keine Unterschiede gefunden. Du kannst die Prüfung abschließen.</div>'}<p style="text-align:right"><button class="button" onclick="finishReview()">Prüfung abschließen</button></p>`}q('#modal').classList.add('open')}function closeModal(){q('#modal').classList.remove('open')}async function create(){try{let p=await api('/profiles','POST',{person:{vorname:q('#first').value.trim(),nachname:q('#last').value.trim(),rolle:q('#newrole').value.trim()}});closeModal();await load();openProfile(p.id);tab('contents');say('Profilentwurf angelegt.')}catch(x){say(x.message)}}async function finishReview(){let entscheidungen=qa('.change').map(x=>({feld:x.dataset.field,id:x.dataset.id,aktion:x.querySelector('input:checked').value}));try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id+'/basis-aenderungen','POST',{entscheidungen});closeModal();variants(true);say('Basisänderungen geprüft.')}catch(x){say(x.message)}}
function tab(x){q('.tab.active')?.classList.remove('active');q(`[data-tab="${x}"]`).classList.add('active');q('.view.active')?.classList.remove('active');q('#'+x).classList.add('active');if(x==='variants')variants();if(x==='documents')q('#documents').innerHTML='<section class="section"><h3>Dokumente</h3><div class="notice">Dateiupload und Export folgen im nächsten großen Paket.</div></section>'}qa('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));function dashboard(){q('#workspace').hidden=true;q('#dashboard').hidden=false;load()}q('#modal').onclick=x=>{if(x.target.id==='modal')closeModal()};load();
</script></body></html>
