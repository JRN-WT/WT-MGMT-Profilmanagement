<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WERK TRIFFT – Profilmanagement</title><style>
:root{--n:#143d6a;--o:#d76f23;--c:#f9f6ef;--p:#fff;--m:#f0ebe0;--l:#c8bea8;--t:#2b2b2b;--s:#66758a;--g:#3d6e56;--r:#832233;--soft:#e8f0f8}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font:14px Arial,sans-serif}.top{height:60px;background:var(--n);color:#fff;border-bottom:3px solid var(--o);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.brand{font-weight:800;letter-spacing:.07em}.sub{color:#cfdae9;font-size:12px}.wrap{max-width:1320px;margin:auto;padding:34px 28px 70px}h1{font-size:30px;margin:0}h2{font-size:18px;margin:0}h3{font:11px monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--s);margin:0}.intro,.muted{color:var(--s);line-height:1.5}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.card,.section,.profilehead{background:var(--p);border:1px solid var(--l);border-radius:8px;overflow:hidden}.card{margin-top:26px}.head,.body{padding:18px}.head{border-bottom:1px solid var(--l)}button{font:inherit}.button{border:0;border-radius:5px;padding:10px 14px;background:var(--o);color:#fff;font-weight:bold;cursor:pointer}.button.secondary,.add{background:var(--m);color:var(--n);border:1px solid var(--l)}.profile{width:100%;border:0;border-bottom:1px solid var(--l);background:#fffefa;text-align:left;padding:16px 18px;display:grid;grid-template-columns:42px 1fr 150px 24px;gap:13px;align-items:center;cursor:pointer}.profile:hover,.variantline:hover{background:#f7f2e8}.avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:#e6ecf5;color:var(--n);font-weight:bold}.name{font-weight:bold}.status{font:11px monospace;padding:4px 7px;width:max-content;background:#fef0e0;color:#9a6800}.Aktuell,.Freigegeben{background:#e0ece5;color:var(--g)}.Basisprofil-aktualisiert{background:var(--soft);color:var(--n)}.tabs{display:flex;gap:22px;border-bottom:1px solid var(--l);margin-top:22px}.tab{border:0;background:transparent;padding:13px 2px;border-bottom:3px solid transparent;font-weight:bold;color:var(--s);cursor:pointer}.tab.active{border-color:var(--o);color:var(--n)}.view{display:none;padding-top:22px}.view.active{display:block}.profilehead{padding:22px;display:flex;gap:16px;align-items:center}.profilehead .avatar{width:60px;height:60px;font-size:18px}.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.section{margin-bottom:16px}.section>h3{padding:14px 17px;border-bottom:1px solid var(--l)}.section>div{padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.field{display:grid;gap:5px}.field label{font:10px monospace;text-transform:uppercase;color:var(--s)}input,textarea{width:100%;padding:9px;border:1px solid var(--l);border-radius:4px;background:#fffefa;font:inherit}textarea{min-height:80px}.item{display:flex;gap:8px;margin:7px 0}.item input{flex:1}.remove{border:0;background:#f8e7e3;color:var(--r);padding:5px 9px;cursor:pointer}.add{margin-top:8px;padding:8px 10px;border-radius:4px;font-weight:bold;cursor:pointer}.notice{background:var(--soft);border-left:3px solid #6680ab;padding:13px;color:var(--n);line-height:1.5}.warning{background:#fff8ec;border-left-color:var(--o)}.variantline{padding:16px 18px;border-bottom:1px solid var(--l);cursor:pointer}.meta{font-size:12px;color:var(--s);margin-top:5px}.choice{display:grid;grid-template-columns:22px 48px 1fr 30px 30px;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--l);background:#fffefa}.choice.off{opacity:.52;background:#f4f1eb}.grip{color:var(--s);cursor:grab;font-size:18px;letter-spacing:-3px;user-select:none}.choice.drag{opacity:.3}.toggle{position:relative;display:inline-block;width:38px;height:22px}.toggle input{opacity:0;width:0;height:0}.slider{position:absolute;inset:0;background:#aab3bb;border-radius:20px;cursor:pointer;transition:.2s}.slider:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.toggle input:checked+.slider{background:var(--g)}.toggle input:checked+.slider:before{transform:translateX(16px)}.arrow{border:0;background:#e6ecf5;color:var(--n);width:28px;height:28px;cursor:pointer;font-weight:bold}.arrow:disabled{opacity:.25;cursor:not-allowed}.modal{display:none;position:fixed;inset:0;background:#143d6a77;place-items:center;padding:20px;z-index:2}.modal.open{display:grid}.dialog{width:min(620px,100%);background:#fff;border-radius:8px;padding:22px}.toast{position:fixed;right:22px;bottom:22px;background:#f1f7f3;border:1px solid var(--g);color:#1a5030;padding:12px;opacity:0;transform:translateY(80px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:700px){.wrap{padding:24px 14px}.top{padding:0 14px}.fields{grid-template-columns:1fr}.wide{grid-column:auto}.profile{grid-template-columns:42px 1fr 24px}.profile .hide{display:none}.profilehead{align-items:flex-start}.actions{margin:10px 0 0}.tabs{gap:14px;overflow:auto}.choice{grid-template-columns:20px 45px 1fr 27px 27px}}
</style></head><body><header class="top"><div><span class="brand">WERK TRIFFT</span> – Profilmanagement</div><div class="sub" id="connection">Lokaler Arbeitsmodus</div></header><main class="wrap"><section id="dashboard"><div class="row"><div><h1>Beraterprofile</h1><p class="intro">Basisprofile pflegen und kundenbezogene Varianten zusammenstellen.</p></div><button class="button" onclick="openModal()">+ Neues Profil</button></div><section class="card"><div class="head"><h3>Profilakten</h3><h2>Alle Profile</h2></div><div id="profiles"></div><div class="body muted" id="footer"></div></section></section><section id="workspace" hidden><div class="profilehead"><div class="avatar" id="initials">–</div><div><div class="row" style="justify-content:start"><h1 id="fullname">–</h1><span class="status" id="pstatus">–</span></div><p class="intro" id="role"></p></div><div class="actions"><button class="button secondary" onclick="dashboard()">← Übersicht</button><button class="button" onclick="newVariant()">+ Variante</button></div></div><nav class="tabs"><button class="tab active" data-tab="overview">Übersicht</button><button class="tab" data-tab="base">Basisprofil</button><button class="tab" data-tab="variants">Varianten</button><button class="tab" data-tab="documents">Dokumente</button></nav><div class="view active" id="overview"></div><div class="view" id="base"></div><div class="view" id="variants"></div><div class="view" id="documents"></div></section></main><div class="modal" id="modal"><div class="dialog"><div class="row"><h2>Neues Profil anlegen</h2><button class="button secondary" onclick="closeModal()">×</button></div><p class="intro">Startet als Entwurf. Fehlende Felder können später ergänzt werden.</p><div class="fields"><div class="field"><label>Vorname</label><input id="first"></div><div class="field"><label>Nachname</label><input id="last"></div><div class="field wide"><label>Aktuelle Rolle</label><input id="newrole"></div></div><p style="text-align:right"><button class="button" onclick="createProfile()">Profil anlegen</button></p></div></div><div class="toast" id="toast"></div><script>
const actor='Julius Rollmann',keys=['kompetenzen','branchen','qualifikationen','sprachen','projekte'];let profile=null,variant=null,drag=null;const q=s=>document.querySelector(s),qa=s=>[...document.querySelectorAll(s)],e=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const labels={kompetenzen:'Kompetenzen',branchen:'Branchen',qualifikationen:'Qualifikationen & Zertifikate',sprachen:'Sprachen',projekte:'Projekterfahrung'};
async function api(path,method='GET',data){let r=await fetch('/api'+path,{method,headers:{'Content-Type':'application/json','X-WT-Actor':actor},body:data?JSON.stringify(data):undefined}),j=await r.json();if(!r.ok)throw Error(j.fehler);return j}function say(s){q('#toast').textContent=s;q('#toast').classList.add('show');setTimeout(()=>q('#toast').classList.remove('show'),3000)}function badge(s){return `<span class="status ${e(s).replaceAll(' ','-')}">${e(s)}</span>`}
async function load(){try{let a=(await api('/profiles')).profile;q('#connection').textContent='JSON-Speicherung aktiv';q('#profiles').innerHTML=a.map(x=>`<button class="profile" onclick="openProfile('${e(x.id)}')"><div class="avatar">${e(x.name.split(' ').map(y=>y[0]).join('').slice(0,2))}</div><div><div class="name">${e(x.name)}</div><div class="muted">${e(x.rolle||'Rolle noch ergänzen')}</div></div><div class="hide">${badge(x.status)}</div><div>›</div></button>`).join('')||'<div class="body muted">Noch keine Profile angelegt.</div>';q('#footer').textContent=a.length+' Profilakte'+(a.length===1?'':'n')}catch(x){q('#connection').textContent='Server nicht erreichbar';say('Server nicht erreichbar. Bitte profilmanagement-server.py starten.')}}
async function openProfile(pid){profile=await api('/profiles/'+pid);variant=null;q('#dashboard').hidden=true;q('#workspace').hidden=false;render();tab('overview')}function summary(k){let a=profile[k]||[];let text=a.slice(0,4).map(x=>k==='sprachen'?`${x.sprache}${x.niveau?' · '+x.niveau:''}`:x.bezeichnung).filter(Boolean).map(e).join(' · ');return text+(a.length>4?` +${a.length-4}`:'')||'—'}function render(){let p=profile;q('#initials').textContent=(p.person.vorname[0]+p.person.nachname[0]).toUpperCase();q('#fullname').textContent=p.person.vorname+' '+p.person.nachname;q('#role').textContent=p.person.rolle||'Rolle noch ergänzen';q('#pstatus').className='status '+p.status.replaceAll(' ','-');q('#pstatus').textContent=p.status;q('#overview').innerHTML=`<section class="section"><h3>Basisprofil · Revision ${p.revision||1}</h3><div><p><b>${e(p.kurzprofil.positionierung||'Positionierung noch ergänzen')}</b></p><p>${e(p.kurzprofil.zusammenfassung||'Für dieses Basisprofil liegt noch keine Zusammenfassung vor.')}</p></div></section><section class="section"><h3>Inhalte im Basisprofil</h3><div class="fields">${['kompetenzen','branchen','qualifikationen','sprachen','projekte'].map(k=>`<div class="field"><label>${labels[k]}</label><div>${summary(k)}</div></div>`).join('')}</div></section><section class="section"><h3>Prüfhinweise</h3><div class="notice">${p.hinweise.length?p.hinweise.map(e).join('<br>'):'Keine offenen Hinweise.'}</div></section>`;renderBase()}
function baseItem(x,k){let a=k==='sprachen'?x.sprache:x.bezeichnung,b=k==='sprachen'?x.niveau:x.details||'';return `<div class="item" data-id="${e(x.id||'')}"><input onkeydown="baseEnter(event,'${k}')" value="${e(a||'')}" placeholder="${k==='sprachen'?'Sprache':'Bezeichnung'}">${k==='sprachen'?`<input onkeydown="baseEnter(event,'${k}')" value="${e(b)}" placeholder="Niveau, z. B. C1">`:''}<button class="remove" onclick="this.parentElement.remove()">×</button></div>`}function addBase(k){q('#base-'+k).insertAdjacentHTML('beforeend',baseItem({},k));q('#base-'+k).lastElementChild.querySelector('input').focus()}function baseEnter(ev,k){if(ev.key!=='Enter')return;ev.preventDefault();let a=[...ev.target.closest('.item').querySelectorAll('input')];if(k==='sprachen'&&ev.target===a[0]&&a[0].value.trim()){a[1].focus();return}if(ev.target.value.trim())addBase(k)}function collectBase(k){return qa('#base-'+k+' .item').map(r=>{let a=[...r.querySelectorAll('input')].map(x=>x.value.trim());return k==='sprachen'?{id:r.dataset.id||crypto.randomUUID(),sprache:a[0],niveau:a[1]}:{id:r.dataset.id||crypto.randomUUID(),bezeichnung:a[0],details:''}}).filter(x=>k==='sprachen'?x.sprache:x.bezeichnung)}
function baseList(k){return `<section class="section"><h3>${labels[k]}</h3><div><div id="base-${k}">${(profile[k]||[]).map(x=>baseItem(x,k)).join('')}</div><button class="add" onclick="addBase('${k}')">+ hinzufügen</button>${k==='sprachen'?'<p class="muted" style="font-size:12px">Sprache und Niveau getrennt erfassen, z. B. „Englisch“ und „C1“.</p>':'<p class="muted" style="font-size:12px">Enter legt den nächsten Eintrag an.</p>'}</div></section>`}function renderBase(){let p=profile;q('#base').innerHTML=`<div class="row"><div><h2>Basisprofil</h2><p class="intro">Hier werden alle Informationen gepflegt. Varianten übernehmen diese Informationen automatisch.</p></div><button class="button" onclick="saveBase()">Basisprofil speichern</button></div><section class="section"><h3>Stammdaten</h3><div class="fields">${[['vorname','Vorname'],['nachname','Nachname'],['rolle','Aktuelle Rolle'],['standort','Standort'],['interneEmail','Interne E-Mail'],['telefon','Telefonnummer']].map(x=>`<div class="field"><label>${x[1]}</label><input data-person="${x[0]}" value="${e(p.person[x[0]]||'')}"></div>`).join('')}</div></section><section class="section"><h3>Kurzprofil</h3><div class="fields"><div class="field wide"><label>Positionierung</label><textarea id="pos">${e(p.kurzprofil.positionierung||'')}</textarea></div><div class="field wide"><label>Zusammenfassung</label><textarea id="sum">${e(p.kurzprofil.zusammenfassung||'')}</textarea></div></div></section>${keys.map(baseList).join('')}`}async function saveBase(){let person={};qa('[data-person]').forEach(x=>person[x.dataset.person]=x.value.trim());try{profile=await api('/profiles/'+profile.id,'PUT',{status:profile.status,person,kurzprofil:{positionierung:q('#pos').value.trim(),zusammenfassung:q('#sum').value.trim()},...Object.fromEntries(keys.map(k=>[k,collectBase(k)]))});render();load();say('Basisprofil gespeichert. Varianten sind zur Prüfung markiert.')}catch(x){say(x.message)}}
async function newVariant(){variant=await api('/profiles/'+profile.id+'/variants','POST',{name:'Neue Profilvariante',zielrolle:profile.person.rolle});tab('variants');variants(true)}async function openVariant(vid){variant=await api('/profiles/'+profile.id+'/variants/'+vid);variants(true)}function entries(k){let map=Object.fromEntries((variant.auswahl?.[k]||[]).map(x=>[x.id,x]));return (profile[k]||[]).map((x,i)=>({...x,sichtbar:map[x.id]?.sichtbar===true,reihenfolge:map[x.id]?.reihenfolge??i+1})).sort((a,b)=>a.reihenfolge-b.reihenfolge)}function choice(k,x,i,n){let title=k==='sprachen'?`${x.sprache||''} · ${x.niveau||'Niveau nicht angegeben'}`:(x.bezeichnung||'Ohne Bezeichnung');return `<div class="choice ${x.sichtbar?'':'off'}" draggable="true" data-id="${e(x.id)}" data-key="${k}"><span class="grip" title="Ziehen zum Priorisieren">⠿</span><label class="toggle" title="In dieser Variante ein-/ausschalten"><input type="checkbox" ${x.sichtbar?'checked':''} onchange="toggleChoice(this)"><span class="slider"></span></label><span>${e(title)}</span><button class="arrow" onclick="moveChoice(this,-1)" ${i===0?'disabled':''}>↑</button><button class="arrow" onclick="moveChoice(this,1)" ${i===n-1?'disabled':''}>↓</button></div>`}function choiceSection(k){let a=entries(k);return `<section class="section"><h3>${labels[k]} · ein-/ausschalten und priorisieren</h3><div class="choices" data-key="${k}">${a.map((x,i)=>choice(k,x,i,a.length)).join('')||'<p class="muted">Im Basisprofil sind noch keine Einträge vorhanden.</p>'}</div></section>`}async function variants(edit=false){let vs=(await api('/profiles/'+profile.id+'/variants')).varianten;if(!edit||!variant){q('#variants').innerHTML=`<div class="row"><div><h2>Varianten</h2><p class="intro">Varianten übernehmen alles aus dem Basisprofil. Du steuerst nur Sichtbarkeit und Reihenfolge.</p></div><button class="button" onclick="newVariant()">+ Variante</button></div><section class="section">${vs.map(x=>`<div class="variantline" onclick="openVariant('${e(x.id)}')"><b>${e(x.name)}</b><div class="meta">${e(x.zielrolle||'Zielrolle noch ergänzen')} · geprüft gegen Revision ${x.basisRevisionGeprueft||1}</div><div style="margin-top:7px">${badge(x.status)}</div></div>`).join('')||'<div class="body muted">Noch keine Variante angelegt.</div>'}</section>`;return}q('#variants').innerHTML=`<div class="row"><div><h2>Variante bearbeiten</h2><p class="intro">Es werden immer alle Einträge des Basisprofils gezeigt. Der Schalter entscheidet, ob ein Eintrag in dieser Variante enthalten ist.</p></div><div><button class="button secondary" onclick="variant=null;variants()">← Varianten</button>${variant.pruefungErforderlich?'<button class="button" onclick="finishReview()">Prüfung abschließen</button>':''}</div></div>${variant.pruefungErforderlich?'<div class="notice warning">Das Basisprofil wurde geändert. Neue Einträge sind ausgeschaltet; prüfe Sichtbarkeit und Reihenfolge, dann schließe die Prüfung ab.</div>':''}<section class="section"><h3>Kontext der Variante</h3><div class="fields"><div class="field"><label>Name</label><input id="vn" value="${e(variant.name)}"></div><div class="field"><label>Zielrolle</label><input id="vr" value="${e(variant.zielrolle||'')}"></div><div class="field"><label>Kunde</label><input id="vk" value="${e(variant.kunde||'')}"></div><div class="field"><label>Anfrage / Projekt</label><input id="va" value="${e(variant.anfrage||'')}"></div></div></section>${keys.map(choiceSection).join('')}<p style="text-align:right"><button class="button secondary" onclick="saveVariant('Entwurf')">Entwurf speichern</button> <button class="button" onclick="saveVariant('Freigegeben')">Freigeben</button></p>`;dnd()}function toggleChoice(box){box.closest('.choice').classList.toggle('off',!box.checked)}function moveChoice(btn,delta){let r=btn.closest('.choice'),s=delta<0?r.previousElementSibling:r.nextElementSibling;if(s){r.parentElement.insertBefore(r,delta<0?s:s.nextElementSibling);refreshArrows(r.parentElement)}}function refreshArrows(parent){qa('.choice',parent).forEach((x,i,a)=>{let b=qa('.arrow',x);b[0].disabled=i===0;b[1].disabled=i===a.length-1})}function dnd(){qa('.choice').forEach(x=>{x.ondragstart=()=>{drag=x;x.classList.add('drag')};x.ondragend=()=>x.classList.remove('drag');x.ondragover=ev=>{ev.preventDefault();let r=x.getBoundingClientRect();x.parentElement.insertBefore(drag,ev.clientY<r.top+r.height/2?x:x.nextSibling);refreshArrows(x.parentElement)}})}function selection(){let out={};qa('.choices').forEach(c=>out[c.dataset.key]=qa('.choice',c).map((x,i)=>({id:x.dataset.id,sichtbar:x.querySelector('input[type=checkbox]').checked,reihenfolge:i+1})));return out}async function saveVariant(status){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id,'PUT',{name:q('#vn').value.trim()||'Unbenannte Variante',zielrolle:q('#vr').value.trim(),kunde:q('#vk').value.trim(),anfrage:q('#va').value.trim(),auswahl:selection(),status});variants(true);load();say(status==='Freigegeben'?'Variante freigegeben.':'Variantensteuerung gespeichert.')}catch(x){say(x.message)}}async function finishReview(){try{variant=await api('/profiles/'+profile.id+'/variants/'+variant.id+'/basis-aenderungen','POST',{});variants(true);say('Basisprofil-Änderungen geprüft.')}catch(x){say(x.message)}}
function tab(id){q('.tab.active')?.classList.remove('active');q(`[data-tab="${id}"]`).classList.add('active');q('.view.active')?.classList.remove('active');q('#'+id).classList.add('active');if(id==='variants')variants();if(id==='documents')q('#documents').innerHTML='<section class="section"><h3>Dokumente</h3><div class="notice">Dateiupload und Export folgen im nächsten großen Paket.</div></section>'}qa('.tab').forEach(x=>x.onclick=()=>tab(x.dataset.tab));function dashboard(){q('#workspace').hidden=true;q('#dashboard').hidden=false;load()}function openModal(){q('#modal').classList.add('open')}function closeModal(){q('#modal').classList.remove('open')}async function createProfile(){try{let p=await api('/profiles','POST',{person:{vorname:q('#first').value.trim(),nachname:q('#last').value.trim(),rolle:q('#newrole').value.trim()}});closeModal();await load();openProfile(p.id);tab('base');say('Profilentwurf angelegt.')}catch(x){say(x.message)}}load();
</script></body></html>
